name: krytis

# Required BuildStream version
min-version: 2.5

# Subdirectory where elements are stored
element-path: elements

(@):
  - freedesktop-sdk.bst:include/runtime.yml
  - include/aliases.yml

options:
  arch:
    type: arch
    description: Machine architecture
    variable: arch
    values:
      - x86_64
  x86_64_v3:
    type: bool
    description: Enable x86_64-v3 (AVX2) optimisations
    default: true

fatal-warnings:
  - overlaps
  - unaliased-url
  - unstaged-files

sandbox:
  build-arch: "%{arch}"

variables:
  (@):
    - freedesktop-sdk.bst:include/repo_branches.yml
    - include/variables.yml
    - include/image-version.yml
  branch: 26.08beta
  (?):
    - arch == "x86_64":
        go-arch: "amd64"
        systemd-arch: "x86-64"
    - arch == "aarch64":
        go-arch: "arm64"
        systemd-arch: "arm64"

artifacts:
  # krytis's bow Buildbarn instance (bst-cache.ririi.dev, materia repo,
  # issue #28 — see #234/#338/#340) is deliberately NOT declared in this
  # block. bow requires a bearer token for every RPC, read or write, and no
  # token is ever committed to this repo — an entry without access-token
  # can never authenticate, so declaring one here would be permanent dead
  # weight producing only UNAUTHENTICATED warnings on every build. bow is
  # reached exclusively via a user-config override supplying access-token
  # (see cache-warm.yml's "Configure BuildStream" step and
  # docs/skills/ci-runner.md).
  - url: https://gbm.gnome.org:11003
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

source-caches:
  # krytis-owned Buildbarn remote-asset (source cache) — see #234/#338/#339.
  # Retains krytis-specific sources (e.g. linux-cachyos .pkg.tar.zst) so
  # upstream removals like #233's CachyOS 404 don't break bst fetch on a
  # cold cache. Buildbarn splits the remote-asset index (bb-asset,
  # URI-to-digest lookup) from the CAS storage (bb-storage, actual blob
  # content) across two services/ports — BuildStream needs both named
  # explicitly via type: index / type: storage; a single unsplit entry (the
  # default type: all) assumes one endpoint serves both and fails with
  # "unknown service ...ContentAddressableStorage" against bb-asset alone.
  #
  # The deployed bow instance itself (bst-cache.ririi.dev, materia repo,
  # issue #28) is deliberately NOT declared here — see artifacts: above for
  # why (identical reasoning: no token is ever committed, so a project.conf
  # entry for bow can never authenticate).
  - url: https://gbm.gnome.org:11003
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180
  - url: https://cache.projectbluefin.io:11001
    connection-config:
      keepalive-time: 180
      retry-limit: 5
      retry-delay: 500
      request-timeout: 180

plugins:
  - origin: junction
    junction: plugins/buildstream-plugins.bst
    elements:
      - autotools
      - meson
      - cmake
      - make
    sources:
      - patch

  - origin: junction
    junction: plugins/buildstream-plugins-community.bst
    elements:
      - collect_manifest
      - pyproject
    sources:
      - cargo2
      - git_module
      - git_repo
      - go_module
      - patch_queue
      - zip

  - origin: junction
    junction: gnome-build-meta.bst
    elements:
      - collect_initial_scripts

junctions:
  internal:
  - plugins/buildstream-plugins.bst
  - plugins/buildstream-plugins-community.bst

sources:
  git_repo:
    config:
      ref-format: git-describe

# Per-kind element overrides. These compose *over* a plugin's own defaults,
# which is why this cannot live in the top-level `variables:` block: the meson
# plugin ships `meson-global: ''` in its own meson.yaml, and a project-level
# variable loses to it. freedesktop-sdk configures its own build the same way
# (its project.conf `elements: meson: (@): include/_private/meson-conf.yml`).
elements:
  meson:
    variables:
      # Without this, meson uses its own default buildtype -- `debug`, i.e.
      # -O0, with b_ndebug=false so NDEBUG is never defined -- and the image
      # ships unoptimised, assert-enabled binaries. noctalia made that visible
      # by compiling in its `#ifndef NDEBUG` DEBUG bar pill (#604).
      #
      # Do NOT copy fdsdk's `--buildtype=plain` here. plain emits no -O/-g of
      # its own and defers to CFLAGS/CXXFLAGS, which fdsdk sets and krytis does
      # not -- it would drop optimisation *and* debug info.
      #
      # debugoptimized (-O2 -g) rather than release, because the -g is
      # load-bearing: %{strip-binaries} splits debug info into %{debugdir} via
      # freedesktop-sdk-stripper, and release drops -g. b_ndebug is `true`
      # rather than `if-release`, which only fires for release/plain.
      #
      # werror=false is a consequence of b_ndebug, not an unrelated opinion.
      # Defining NDEBUG makes assert() expand to nothing, so any local that
      # exists only to be asserted on becomes an unused variable -- and an
      # upstream that builds with -Werror then fails. wlroots 0.20.1 does
      # exactly this in render/pass.c:22 (`const struct wlr_fbox *box` feeds
      # only an assert). That is a whole class of failure across any C/C++
      # project, not one bug, and -Werror is a developer setting rather than a
      # distributor one -- Fedora, Debian and Arch all disable it. Warnings are
      # still printed; they just stop being fatal.
      #
      # Per-element `meson-local` is appended after this, so it still wins.
      meson-global: >-
        --buildtype=debugoptimized
        -Db_ndebug=true
        -Dwerror=false
