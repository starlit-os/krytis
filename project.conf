name: krytis

# Required BuildStream version
min-version: 2.5

# Subdirectory where elements are stored
element-path: elements

(@):
  - freedesktop-sdk.bst:include/runtime.yml
  - include/aliases.yml

options:
  arch:
    type: arch
    description: Machine architecture
    variable: arch
    values:
      - x86_64
  x86_64_v3:
    type: bool
    description: Enable x86_64-v3 (AVX2) optimisations
    default: true

fatal-warnings:
  - overlaps
  - unaliased-url
  - unstaged-files

sandbox:
  build-arch: "%{arch}"

variables:
  (@):
    - freedesktop-sdk.bst:include/repo_branches.yml
    - include/variables.yml
    - include/image-version.yml
  branch: 26.08
  (?):
    - arch == "x86_64":
        go-arch: "amd64"
        systemd-arch: "x86-64"
    - arch == "aarch64":
        go-arch: "arm64"
        systemd-arch: "arm64"

# There is deliberately no artifacts: or source-caches: block.
#
# Two rules decide whether an entry here could ever serve a krytis build, and
# nothing currently passes both:
#
#   1. Project scope. BuildStream resolves a project's remotes as "user config
#      + that project's own project.conf", and never inherits the toplevel
#      project's list into a junction (`_resolve_specs_for_project` in
#      buildstream/_context.py). An entry here is consulted only for elements
#      of the project named `krytis`.
#   2. Ref namespace. Artifact refs are `<project-name>/<element>/<key>`
#      (`_compose_artifact_name` in buildstream/element.py), so a remote can
#      only answer for an entry here if it already holds `krytis/…` refs.
#
# https://gbm.gnome.org:11003 failed rule 1 and was dropped in #942:
# gnome-build-meta declares it in its own project.conf, so gbm's elements reach
# it with no help from us. https://cache.projectbluefin.io:11001 failed rule 2
# and was dropped in #954: it is dakota's cache, dakota's project.conf sets
# `name: bluefin`, and a direct probe confirmed it serves `freedesktop-sdk/…`
# refs while missing every `krytis/…` ref put to it. Its fdsdk content is
# unreachable from here twice over — rule 1 sends fdsdk elements to fdsdk's own
# cache, and x86_64_v3 diverges their keys regardless (see
# docs/skills/ci-runner.md).
#
# krytis's bow Buildbarn instance (bst-cache.ririi.dev, materia repo, issue #28
# — see #234/#338/#340) is the only remote that can ever hold matching krytis
# keys, and it is deliberately not declared here either: bow requires a bearer
# token for every RPC, read or write, and no token is ever committed to this
# repo, so a token-less entry could only produce UNAUTHENTICATED warnings on
# every build. It is wired through a user-config override instead — `mise run
# bst --push`/`--pull` and cache-warm.yml's "Configure BuildStream" step —
# which needs two entries there, type: index (bb-asset) and type: storage
# (bb-storage); see docs/skills/ci-runner.md.
#
# Consequence: without a bow token there is no remote artifact or source reuse
# for krytis's own elements. That was already the case in practice — no remote
# has ever been observed serving a krytis ref.

plugins:
  - origin: junction
    junction: plugins/buildstream-plugins.bst
    elements:
      - autotools
      - meson
      - cmake
      - make
    sources:
      - patch

  - origin: junction
    junction: plugins/buildstream-plugins-community.bst
    elements:
      - collect_manifest
      - pyproject
    sources:
      - cargo2
      - git_module
      - git_repo
      - go_module
      - patch_queue
      - zip

  - origin: junction
    junction: gnome-build-meta.bst
    elements:
      - collect_initial_scripts

junctions:
  internal:
  - plugins/buildstream-plugins.bst
  - plugins/buildstream-plugins-community.bst

sources:
  git_repo:
    config:
      ref-format: git-describe

# Per-kind element overrides. These compose *over* a plugin's own defaults,
# which is why this cannot live in the top-level `variables:` block: the meson
# plugin ships `meson-global: ''` in its own meson.yaml, and a project-level
# variable loses to it. freedesktop-sdk configures its own build the same way
# (its project.conf `elements: meson: (@): include/_private/meson-conf.yml`).
elements:
  meson:
    variables:
      # What actually sets -O and -g here is not this block: it is fdsdk's
      # include/flags.yml, which exports CFLAGS/CXXFLAGS="-O2 -pipe -g ..." and
      # reaches every krytis element through the `freedesktop-sdk.bst:include/
      # runtime.yml` include at the top of this file (there since the first
      # commit). Meson puts CFLAGS *after* its own build-type flags, and gcc
      # takes the last -O, so every build type compiles at -O2 -g here
      # (meson 1.7.0, CFLAGS="-O2 -pipe -g"):
      #
      #   debug           -O0 -g -O2 -pipe -g
      #   plain           -O2 -pipe -g
      #   debugoptimized  -O2 -g -O2 -pipe -g
      #
      # So the setting that matters in this block is b_ndebug. Without it,
      # meson's default b_ndebug=false never defines NDEBUG, and anything
      # behind `#ifndef NDEBUG` ships. noctalia made that visible by compiling
      # in its DEBUG bar pill (#604). b_ndebug is `true` rather than
      # `if-release`, which only fires for release/plain -- noctalia's own
      # meson.build says `if-release`, which is exactly why it never took.
      #
      # The build type is debugoptimized for meson's `debug` option, which some
      # projects read directly: get_option('debug') is true here and false under
      # plain or release. Changing it re-keys every krytis meson element for
      # that alone, so it stays unless a project's use of the option says
      # otherwise. (systemd's src/boot/meson.build turns on EFI_DEBUG from it --
      # which is how its serial banners disappeared when systemd's element
      # moved to gnome-build-meta's `plain`; see docs/skills/secure-boot.md.)
      #
      # werror=false is a consequence of b_ndebug, not an unrelated opinion.
      # Defining NDEBUG makes glibc's assert() expand to nothing, so any local that
      # exists only to be asserted on becomes an unused variable -- and an
      # upstream that builds with -Werror then fails. wlroots 0.20.1 does
      # exactly this in render/pass.c:22 (`const struct wlr_fbox *box` feeds
      # only an assert). That is a whole class of failure across any C/C++
      # project, not one bug, and -Werror is a developer setting rather than a
      # distributor one -- Fedora, Debian and Arch all disable it. Warnings are
      # still printed; they just stop being fatal.
      #
      # Per-element `meson-local` is appended after this, so it still wins.
      # Junction elements are not affected at all: an element's `elements:`
      # block comes from the project that owns it, so gnome-build-meta's and
      # fdsdk's meson elements keep their own `--buildtype=plain` and no
      # b_ndebug. systemd ships with NDEBUG undefined for that reason, by
      # decision (#1108): its assert() is systemd's own, logging and aborting
      # without NDEBUG and turning into __builtin_unreachable() with it.
      meson-global: >-
        --buildtype=debugoptimized
        -Db_ndebug=true
        -Dwerror=false
