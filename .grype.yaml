  # ── bitnami namespace: right project, cited fix predates what we ship ──
  # Version-pinned on purpose: the claim is about this exact installed version.
  # Pillow: elements/overrides/python3-pil.bst (fdsdk's components/python3-pil.bst,
  # run ahead at 13.0.0) — Grype's "bitnami" namespace stock-matcher (no purl)
  # matches CVEs whose real fixed version is far below the installed one.
  # GitHub's advisories: CVE-2024-28219 (GHSA-44wm-f244-xhp3) fixed in 10.3.0,
  # CVE-2025-48379 (GHSA-xg8h-j46f-w952) fixed in 11.3.0. Re-pinned from 12.3.0
  # on 2026-10-21 when the override moved Pillow to 13.0.0.
  - vulnerability: BIT-pillow-2024-28219
    package:
      name: Pillow
      version: "13.0.0"
  - vulnerability: BIT-pillow-2025-48379
    package:
      name: Pillow
      version: "13.0.0"
  # sqlite: components/sqlite.bst — same "bitnami" stock-matcher issue as
  # Pillow above: installed 3.53.4 postdates every fixed-in version cited.
  - vulnerability: BIT-sqlite-2025-6965
    package:
      name: sqlite
      version: "3.53.4"
  - vulnerability: BIT-sqlite-2024-0232
    package:
      name: sqlite
      version: "3.53.4"
  - vulnerability: BIT-sqlite-2025-29088
    package:
      name: sqlite
      version: "3.53.4"

  # ── Class 2: dependency-graph-proven unreachable (version-pinned; see header) ──
  # rustls-webpki 0.101.7 (via rustls 0.21.12): part of freedesktop-sdk's
  # gstreamer-plugins-rs.bst cargo2 vendor snapshot for the whole gst-plugins-rs
  # workspace, but dependency-graph-traced (issue #500, via the real upstream
  # Cargo.lock at ref 0.15.4-0-g1afff3711855238433862c0ce3bf34918e500386, the one
  # freedesktop-sdk-26.08.4 pins; re-traced 2026-11-02, first traced on 0.15.3) to be
  # reachable *only* from the `aws` and `webrtc` plugins, both disabled by krytis's
  # meson config (only rtp/gif/hlssink3/dav1d/spotify enabled) — confirmed unreachable
  # from every plugin cdylib krytis actually builds. See issue #500 for the full trace.
  - vulnerability: GHSA-82j2-j2ch-gfr8
    package:
      name: rustls-webpki
      version: "0.101.7"
  - vulnerability: GHSA-965h-392x-2mh5
    package:
      name: rustls-webpki
      version: "0.101.7"
  - vulnerability: GHSA-xgp8-3hg3-c2mh
    package:
      name: rustls-webpki
      version: "0.101.7"
  # rustls-webpki 0.102.8 (via rustls 0.22.4), same vendor snapshot: reachable only
  # from the `spotify` plugin (librespot-core -> hyper-proxy2/rustls -> hyper-rustls
  # 0.26 -> rustls 0.22.4; same 0.15.4 trace as above). That plugin IS built, but
  # elements/oci/krytis/image.bst deletes libgstspotify.so at assembly (#500), so
  # nothing on the image reaches 0.102.8. The `rm` there has no -f: if fdsdk stops
  # shipping the plugin the build fails, and this rule goes with that command. GHSA
