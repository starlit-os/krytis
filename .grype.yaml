# Grype ignore rules for confirmed false positives / provably-unreachable matches.
# Two distinct classes, each documented where its entries start below. The two
# classes are pinned differently on purpose — see "How each class is pinned".
#
# 1. Cross-ecosystem stock-matcher false positives (docs/skills/sbom.md § Mitigated:
#    Grype stock-matcher cross-ecosystem false positives). package.type is empty (no
#    purl/CPE), so Grype checked the bare package name against every GHSA language
#    namespace instead of the artifact's real ecosystem. Verified per-entry via
#    matchDetails[0].searchedBy.namespace on a real scan (first established 2026-08-05,
#    Grype 0.116.1; re-verified 2026-09-29, Grype 0.119.0) — each `namespace` named
#    below is the *wrong* ecosystem the match came from, not the artifact's real one.
#
# 2. Dependency-graph-proven unreachable rust-matcher/purl-scoped matches (docs/skills/
#    sbom.md § Mitigated: dependency-graph-proven unreachable crate versions, issue
#    #500). A real purl-scoped match against a genuinely vulnerable crate version that
#    is present in an SBOM vendor snapshot but never linked into any binary krytis
#    actually builds — confirmed by walking the real upstream Cargo.lock, not by
#    ecosystem mismatch. Narrower and requires more evidence than class 1: only use
#    when the full reachability graph from every enabled build target has been walked
#    and shown to exclude the vulnerable crate entirely.
#
#    The `bitnami`-namespace entries (Pillow, sqlite) are a third, smaller shape: a
#    real advisory for that exact project whose cited fixed-in version is *below* the
#    installed one. Pinned like class 2 for the same reason — see below.
#
# How each class is pinned
# ------------------------
# Class 1 rules carry `namespace` + `package.name` and deliberately NO
# `package.version`. The defect being suppressed is that a native/Python artifact was
# searched in a *foreign language namespace*; that mismatch is a property of the name
# and the namespace, not of the version, and it cannot become true at some later
# version. A version pin therefore bought no safety — it only guaranteed the rule went
# inert on the next routine dependency bump and the same false positive re-blocked a
# PR at Critical (observed three times: markdown 3.10.2→3.10.3 and shaderc 2025.3→
# 2026.3 on 2026-09-01, then networkx 3.6.1→3.7 and shaderc 2026.3→2026.4 on
# freedesktop-sdk 26.08.1→26.08.2, PR #993). `namespace` replaces the version pin as
# the guard and is strictly tighter than what it replaces: a *correctly*-namespaced
# advisory against the same package is still reported. Proof that this is not
# over-broad is in-tree — GNU `tar` 1.35's 17 npm GHSAs are ignored below via
# `github:language:javascript`, while the Rust `tar` 0.4.45 crate's
# GHSA-3pv8-6f4r-ffg2 (`github:language:rust`) is NOT suppressed and still reports.
#
# Class 2 and the `bitnami` entries keep an exact `package.version`, because those
# judgments ARE version-dependent: "this crate version is unreachable from any enabled
# build target" and "the installed version already postdates the cited fix" are both
# claims about one specific version. A bump there must re-open the question, so the
# rule going inert is the correct behaviour, not a maintenance bug.
#
# Grype semantics relied on here (verified against grype/match/ignore.go at v0.119.0,
# `getIgnoreConditionsForRule`): every populated field is an AND-ed condition and an
# empty field imposes none, so omitting `version` matches any version;
# `package.version` is exact string equality with no glob/range support; `namespace`
# is compared against the match's `.vulnerability.namespace`.
ignore:
  # ── Class 1: cross-ecosystem false positives (no version pin; see header) ──
  # json: nlohmann/json (C++, components/nlohmann-json.bst)
  - vulnerability: GHSA-3c6g-pvg8-gqw2
    namespace: github:language:javascript
    package:
      name: json
  # libidn2: GNU libidn2 (C, components/libidn2.bst)
  - vulnerability: GHSA-j6m4-68hc-mqq9
    namespace: github:language:javascript
    package:
      name: libidn2
  # libnotify: GNOME libnotify (C, gnome-build-meta.bst:sdk/libnotify.bst) —
  # matched against npm's unrelated "libnotify" desktop-notification wrapper.
  - vulnerability: GHSA-6898-wx94-8jq8
    namespace: github:language:javascript
    package:
      name: libnotify
  # markdown: Python-Markdown (components/python3-markdown.bst) — a real Python
  # package, but searched in the *javascript* namespace, not its own.
  - vulnerability: GHSA-wx77-rp39-c6vg
    namespace: github:language:javascript
    package:
      name: markdown
  # networkx: NetworkX (components/python3-networkx.bst) — same shape as markdown:
  # a Python package matched against an npm "Malware in networkx" advisory whose
  # constraint is ">=0 (semantic)", i.e. every version, in the wrong ecosystem.
  - vulnerability: GHSA-m4cf-q2p6-q6pv
    namespace: github:language:javascript
    package:
      name: networkx
  # paste: the Rust `paste` crate vendored in desktop/mesa-all-codecs.bst, matched
  # against PyPI's unrelated "Paste" WSGI framework.
  - vulnerability: GHSA-27px-qpmj-qg38
    namespace: github:language:python
    package:
      name: paste
  - vulnerability: GHSA-7gfc-2v6g-6w9f
    namespace: github:language:python
    package:
      name: paste
  # shaderc: Google shaderc (C++, components/shaderc.bst)
  - vulnerability: GHSA-3h68-ppv2-8p9v
    namespace: github:language:javascript
    package:
      name: shaderc
  # tar: GNU tar (C, bootstrap/base-sdk/tar.bst + components/tar.bst) matched against
  # npm tar/node-tar. The Rust `tar` crate's own advisories live in
  # github:language:rust and are deliberately still reported.
  - vulnerability: GHSA-23hp-3jrh-7fpw
    namespace: github:language:javascript
    package:
      name: tar
  - vulnerability: GHSA-34x7-hfp2-rc4v
    namespace: github:language:javascript
    package:
      name: tar
  - vulnerability: GHSA-3jfq-g458-7qm9
    namespace: github:language:javascript
    package:
      name: tar
  - vulnerability: GHSA-5955-9wpr-37jh
    namespace: github:language:javascript
    package:
      name: tar
  - vulnerability: GHSA-83g3-92jg-28cx
    namespace: github:language:javascript
    package:
      name: tar
  - vulnerability: GHSA-8qq5-rm4j-mr97
    namespace: github:language:javascript
    package:
      name: tar
  - vulnerability: GHSA-8x88-c5mf-7j5w
    namespace: github:language:javascript
    package:
      name: tar
  - vulnerability: GHSA-9ppj-qmqm-q256
    namespace: github:language:javascript
    package:
      name: tar
  - vulnerability: GHSA-f5x3-32g6-xq36
    namespace: github:language:javascript
    package:
      name: tar
  - vulnerability: GHSA-gfjr-3jmm-4g9v
    namespace: github:language:javascript
    package:
      name: tar
  - vulnerability: GHSA-gvwx-54wh-qm9j
    namespace: github:language:javascript
    package:
      name: tar
  - vulnerability: GHSA-j44m-qm6p-hp7m
    namespace: github:language:javascript
    package:
      name: tar
  - vulnerability: GHSA-qffp-2rhf-9h96
    namespace: github:language:javascript
    package:
      name: tar
  - vulnerability: GHSA-r292-9mhp-454m
    namespace: github:language:javascript
    package:
      name: tar
  - vulnerability: GHSA-r6q2-hw4h-h46w
    namespace: github:language:javascript
    package:
      name: tar
  - vulnerability: GHSA-vmf3-w455-68vh
    namespace: github:language:javascript
    package:
      name: tar
  - vulnerability: GHSA-w8wr-v893-vjvp
    namespace: github:language:javascript
    package:
      name: tar

  # ── bitnami namespace: right project, cited fix predates what we ship ──
  # Version-pinned on purpose: the claim is about this exact installed version.
  # Pillow: python3-pillow (components/python3-pillow.bst) — Grype's "bitnami"
  # namespace stock-matcher (no purl) matches CVEs whose cited fixed version
  # is far below the actually-installed version (12.3.0 is newer than every
  # fixed-in version below; the CVE was already fixed before this pin).
  - vulnerability: BIT-pillow-2024-28219
    package:
      name: Pillow
      version: "12.3.0"
  - vulnerability: BIT-pillow-2025-48379
    package:
      name: Pillow
      version: "12.3.0"
  # sqlite: components/sqlite.bst — same "bitnami" stock-matcher issue as
  # Pillow above: installed 3.53.4 postdates every fixed-in version cited.
  - vulnerability: BIT-sqlite-2025-6965
    package:
      name: sqlite
      version: "3.53.4"
  - vulnerability: BIT-sqlite-2024-0232
    package:
      name: sqlite
      version: "3.53.4"
  - vulnerability: BIT-sqlite-2025-29088
    package:
      name: sqlite
      version: "3.53.4"

  # ── Class 2: dependency-graph-proven unreachable (version-pinned; see header) ──
  # rustls-webpki 0.101.7 (via rustls 0.21.12): part of freedesktop-sdk's
  # gstreamer-plugins-rs.bst cargo2 vendor snapshot for the whole gst-plugins-rs
  # workspace, but dependency-graph-traced (issue #500, via the real upstream
  # Cargo.lock at ref 0.15.3-0-g6302bea23b53e6461c104f9543df887a63b2d6ec) to be
  # reachable *only* from the `aws` and `webrtc` plugins, both disabled by krytis's
  # meson config (only rtp/gif/hlssink3/dav1d/spotify enabled) — confirmed unreachable
  # from every plugin cdylib krytis actually builds. rustls-webpki 0.102.8 (same
  # GHSAs, via rustls 0.22.4) is deliberately NOT ignored here: it IS reachable, from
  # the enabled `spotify` plugin (librespot-core -> hyper-proxy2/rustls ->
  # hyper-rustls 0.26 -> rustls 0.22.4) — that needs a product decision (drop
  # `-Dspotify=enabled`, or wait on an upstream librespot-core/hyper-proxy2 bump), not
  # a scan suppression. See issue #500 for the full trace.
  - vulnerability: GHSA-82j2-j2ch-gfr8
    package:
      name: rustls-webpki
      version: "0.101.7"
  - vulnerability: GHSA-965h-392x-2mh5
    package:
      name: rustls-webpki
      version: "0.101.7"
  - vulnerability: GHSA-xgp8-3hg3-c2mh
    package:
      name: rustls-webpki
      version: "0.101.7"
