# Grype ignore rules for confirmed cross-ecosystem false positives (docs/skills/sbom.md
# § Known remaining gap: Grype's stock-matcher...). Every entry below matched via
# Grype's stock-matcher fallback: package.type is empty (no purl/CPE), so Grype checked
# the bare package name against every GHSA language namespace instead of the artifact's
# real ecosystem. Verified per-entry via matchDetails[0].searchedBy.namespace on a real
# scan (2026-08-05, Grype 0.116.1) — each `namespace` below names the *wrong* ecosystem
# the match came from, not the artifact's real one (given in the comment).
#
# Pinned to name+version+vulnerability, not name alone: if the underlying BST element
# bumps to a new version, the rule stops applying and Grype will re-flag it — re-verify
# the new match's matchDetails[0].searchedBy.namespace before re-adding.
ignore:
  # json: nlohmann/json (C++, components/nlohmann-json.bst)
  - vulnerability: GHSA-3c6g-pvg8-gqw2
    package:
      name: json
      version: "3.12.0"
  # libidn2: GNU libidn2 (C, components/libidn2.bst)
  - vulnerability: GHSA-j6m4-68hc-mqq9
    package:
      name: libidn2
      version: "2.3.8"
  # markdown: Python-Markdown (components/python3-markdown.bst)
  - vulnerability: GHSA-wx77-rp39-c6vg
    package:
      name: markdown
      version: "3.10.2"
  # networkx: NetworkX (components/python3-networkx.bst)
  - vulnerability: GHSA-m4cf-q2p6-q6pv
    package:
      name: networkx
      version: "3.6.1"
  # paste: vendored copy in desktop/mesa-all-codecs.bst
  - vulnerability: GHSA-27px-qpmj-qg38
    package:
      name: paste
      version: "1.0.14"
  - vulnerability: GHSA-7gfc-2v6g-6w9f
    package:
      name: paste
      version: "1.0.14"
  # shaderc: Google shaderc (C++, components/shaderc.bst)
  - vulnerability: GHSA-3h68-ppv2-8p9v
