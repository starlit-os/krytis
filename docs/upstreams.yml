# Tracks upstream repos mined for lessons applicable to krytis.
#
# Updated by the `upstream-lessons` skill (.claude/skills/upstream-lessons/)
# each time it finishes a mining pass. `last_checked_sha` is the upstream
# commit that was HEAD when lessons were last extracted from that repo — the
# next pass diffs from this SHA to the upstream's new HEAD to find what's new.
#
# See docs/skills/upstream-sync.md for the full workflow and
# https://github.com/starlit-os/krytis/issues/141 for the design rationale.
#
# local_path is a directory name, resolved as a sibling of krytis's *main*
# checkout (not the invoking worktree — `mise upstream-sync` resolves this via
# `git worktree list`, since worktrees live elsewhere on disk).
# The local checkout's origin must point to the upstream repo.

repos:
  - name: dakota
    upstream: projectbluefin/dakota
    # Re-verified 2026-08-31: main last moved 2026-08-09 (22 days stale at
    # check time); the promotion automation itself (auto/promote-testing-to-main)
    # hasn't run since 2026-06-24. testing moves daily and remains the
    # active branch to track. Also checked: 'next' branch is testing + 1
    # commit with no independent history — not a viable alternative.
    branch: testing
    local_path: dakota
    skill_file: docs/skills/dakota.md
    last_checked_sha: 1cf9ef6507366a2e4471cf3cddb0268206e08255
    last_checked_date: "2026-09-14"

  - name: zirconium-hawaii
    upstream: zirconium-dev/zirconium-hawaii
    # Re-verified 2026-08-31: stable is the upstream repo's actual GitHub
    # default branch, current (stable and testing point at the identical
    # commit as of this check). An 'edge' branch exists with more recent
    # activity but shares no git history with stable (git merge-base finds
    # nothing) — an orphan branch, not a viable alternative under this
    # tracking design.
    branch: stable
    local_path: zirconium-hawaii
    skill_file: docs/skills/zirconium-hawaii.md
    last_checked_sha: 807636dca25fb219afcf73a3a5383392f7859071
    last_checked_date: "2026-09-14"
