# krytis delta over niri's /usr/share/xdg-desktop-portal/niri-portals.conf.
# xdp falls through to that file for every interface not listed here.
[preferred]
# Remove once desktop/niri.bst pins a release containing niri 02fdd8e758
# ("portals: add oo7 as secret portal"); portal-routing-check fails then.
# krytis#1028.
org.freedesktop.impl.portal.Secret=oo7-portal;
# niri's default=gnome;gtk sends these to xdp-gnome, which needs
# org.gnome.Shell (GlobalShortcuts) or org.gnome.Mutter.RemoteDesktop /
# .InputCapture (Clipboard rides RemoteDesktop sessions). niri v26.04
# implements none of them, so the call fails after a dialog. Leave them
# unserved instead. portal-routing-check can't see niri growing a service:
# on a niri bump, drop a pin once niri's src/dbus/ serves its name
# (niri-wm/niri#1966 RemoteDesktop, #3587 GlobalShortcuts, #823
# InputCapture). krytis#1054.
org.freedesktop.impl.portal.GlobalShortcuts=none;
org.freedesktop.impl.portal.RemoteDesktop=none;
org.freedesktop.impl.portal.Clipboard=none;
org.freedesktop.impl.portal.InputCapture=none;
