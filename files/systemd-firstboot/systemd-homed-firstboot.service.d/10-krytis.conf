# krytis: create the initial admin account as a systemd-homed-managed user
# (encrypted home, FIDO2-login-ready) instead of leaving first-boot account
# creation to a manual `useradd`. Runs right after the keymap/timezone
# wizard (systemd-firstboot.service.d/10-krytis.conf) on the same reserved
# console, tty2. See docs/design/first-boot-setup.md.
#
# Upstream's default unit orders Before=systemd-user-sessions.service,
# which blocks ALL logins (not just tty2) until the wizard completes or is
# answered -- exactly the class of hang that took systemd-firstboot.service
# off the critical boot path. Cleared here for the same reason: an
# unattended boot (CI, headless) must still reach a usable graphical
# session even though nobody answers this prompt.
#
# The created user is granted `wheel` (sudo, see freedesktop-sdk's
# vm/config/sudo.bst -> /etc/sudoers.d/wheel) directly rather than prompted
# for group membership -- the first-boot user IS the admin account,
# matching every other bootc/desktop-OS first-run flow.
#
# freedesktop-sdk ships this unit *disabled* by default (its own
# systemd-homed-firstboot.preset) -- almost certainly for the same hang
# reason above. krytis's 80-systemd-homed-firstboot.preset re-enables it;
# the numeric prefix sorts before fdsdk's unprefixed filename so ours wins
# (systemd.preset(5): first matching filename in sort order applies).
[Unit]
After=systemd-firstboot.service
Before=
Before=first-boot-complete.target shutdown.target
Conflicts=getty@tty2.service autovt@tty2.service
Before=getty@tty2.service autovt@tty2.service

[Service]
ExecStart=
ExecStart=homectl firstboot --prompt-new-user --prompt-shell=no --prompt-groups=no --member-of=wheel --mute-console=yes
TTYPath=/dev/tty2
StandardInput=tty
StandardOutput=tty
StandardError=tty
TTYReset=yes
