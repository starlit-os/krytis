# krytis: neutralise systemd's homed first-boot wizard --
# krytis-firstboot.service creates the initial account instead. See the sibling
# systemd-firstboot.service.d/10-krytis.conf for why this is done at ExecStart=
# rather than by clearing Before= or disabling the unit.
#
# freedesktop-sdk already presets this unit `disable`d and krytis does not
# re-enable it (72-krytis-firstboot.preset restates the `disable` explicitly), so
# ordinarily it never starts at all. This drop-in is defence in depth: the unit's
# [Install] section is WantedBy=systemd-homed.service with
# Also=systemd-homed.service, so any future preset change that enables it would
# put Before=systemd-user-sessions.service back on the boot path -- blocking
# every login, not just tty5, on a prompt nobody answers.
#
# See docs/design/first-boot-setup.md
[Service]
ExecStart=
ExecStart=/usr/bin/true
StandardInput=null
