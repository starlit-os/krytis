# krytis: run first-boot keymap/timezone setup as an optional console
# wizard instead of blocking the whole boot. Upstream's default unit
# orders Before=sysinit.target and prompts for locale/keymap/timezone/root
# password on /dev/console -- on a UKI/secure-boot image, or a headless/CI
# boot, nothing ever answers that prompt (root:!unprovisioned reads as "no
# password set", so --prompt-root-password waits forever) and sysinit.target
# never completes: greetd, sshd, logind, networking -- nothing after it
# starts. See docs/design/first-boot-setup.md.
#
# krytis keeps root locked (sudo comes from the homed-managed initial user,
# see systemd-homed-firstboot.service.d/10-krytis.conf) and moves this
# wizard off the critical boot path onto tty2, so an unattended boot always
# reaches multi-user/graphical.target. A human completes setup later by
# switching to tty2 (Ctrl+Alt+F2); nothing waits on it.
[Unit]
Before=
Before=first-boot-complete.target shutdown.target
Conflicts=getty@tty2.service autovt@tty2.service
Before=getty@tty2.service autovt@tty2.service

[Service]
ExecStart=
ExecStart=systemd-firstboot --prompt-keymap-auto --prompt-timezone --welcome=no
ImportCredential=
ImportCredential=firstboot.*
TTYPath=/dev/tty2
StandardInput=tty
StandardOutput=tty
StandardError=tty
TTYReset=yes
