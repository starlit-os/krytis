# krytis: neutralise systemd's own first-boot wizard. krytis-firstboot.service
# does this work instead, off the critical boot path.
#
# Why neutralised rather than reconfigured in place:
#
# 1. A drop-in cannot get this unit off the boot path. Its
#    Before=sysinit.target is what hangs an unanswered boot, and systemd's
#    dependency directives (Before=, After=, Wants=, Requires=) are purely
#    ADDITIVE in drop-ins -- an empty assignment does NOT reset the accumulated
#    list, unlike ExecStart= and most other list-valued settings. Verified on
#    systemd 260; see docs/skills/bootc-vm.md
#    § Dependency directives cannot be reset from a drop-in.
#
# 2. A preset cannot disable it either: the unit is `static` (no [Install]
#    section) and is pulled in by systemd's own shipped
#    sysinit.target.wants/systemd-firstboot.service symlink, which
#    `systemctl disable` does not touch.
#
# So the prompt is removed at the one place a drop-in can reach it: ExecStart=,
# which *is* resettable. The unit still runs -- instantly and silently -- and can
# no longer query anything or stall sysinit.target. first-boot-complete.target is
# satisfied as usual.
#
# See docs/design/first-boot-setup.md
[Service]
ExecStart=
ExecStart=/usr/bin/true
StandardInput=null
