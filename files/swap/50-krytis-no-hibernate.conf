# Hibernation is off on krytis (#1751).
#
# The swapfile from config/swap.bst (#510) gives logind a disk swap device, and
# with one it can report CanHibernate=yes. Nothing on krytis has tested resume:
# through the LUKS + FIDO2/TPM unlock, after bootc staged an update, or from the
# sealed UKI. UPower's CriticalPowerAction=Auto calls logind's Sleep() at
# critical battery (upower 1.91.5 src/linux/up-backend.c; the order in
# /etc/UPower/UPower.conf's comment is stale), and Sleep() would pick
# suspend-then-hibernate once hibernation is possible. With these off, logind
# reports "no" and Sleep() can only suspend, as before the swapfile existed.
#
# Opt back in at your own risk with a later-sorting drop-in, e.g.
# /etc/systemd/sleep.conf.d/90-hibernate.conf with AllowHibernation=yes.
# Supporting hibernation properly is #1755.
[Sleep]
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
