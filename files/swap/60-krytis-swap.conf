# Pinned, not inherited (#510). The CachyOS kernel compiles these in (swappiness
# under CONFIG_CACHY in mm/vmscan.c, page_cluster unconditionally in
# mm/swap.c's swap_setup()); mainline's defaults are 60 and 3. #510's
# measurements and decision were made at these values, so a kernel bump must not
# move them silently.
#
# page-cluster = 0: no swap readahead. zswap answers most swap-ins from RAM,
# where readahead buys nothing, and NVMe random reads are cheap for the rest.
vm.swappiness = 100
vm.page-cluster = 0
