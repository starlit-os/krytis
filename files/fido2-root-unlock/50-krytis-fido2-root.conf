# Skip the generated unlock when krytis-fido2-root-unlock.service already attached the
# volume with a FIDO2 token. Without this, the generated unit would run a second attach
# against a name that is already in use and fail, taking the boot into emergency mode
# despite the root being unlocked.
#
# A condition that evaluates false is NOT a job failure in systemd, so cryptsetup.target
# and everything ordered after it still proceed - the volume is open either way, and
# dev-gpt-auto-root.device appears from the mapper node regardless of which unit made it.
#
# This file deliberately does NOT touch ExecStart. See
# krytis-fido2-root-unlock.service in this directory for why, and #250.
#
# Wants= is what actually starts that unit. Before= only orders; it does not pull
# anything in, so without this line the FIDO2 attempt would sit in the initrd and never
# run. Riding on this unit's own activation is more robust than shipping a
# cryptsetup.target.wants/ symlink and hoping dracut copies it: whatever pulls the root
# unlock in - cryptsetup.target, the device unit - pulls our attempt in with it.
#
# Wants= not Requires=: our attempt is expected to fail on machines with no enrolled
# token, and that must never fail the real unlock.
[Unit]
Wants=krytis-fido2-root-unlock.service
ConditionPathExists=!/dev/mapper/root
