# Add fido2-device=auto to the ROOT volume's unlock options.
#
# Why a drop-in rather than the kernel cmdline: rd.luks.options= is read by
# systemd-cryptsetup-generator, which builds units from crypttab-style input. krytis's
# root has no crypttab entry — the sealed UKI carries no rd.luks.uuid and hostonly=no
# leaves no /etc/crypttab in the initrd — so the unit is created by
# systemd-gpt-auto-generator instead, which constructs its own option string and never
# reads that karg. Measured on hardware: the boot log said "No valid TPM2 token data
# found" and mentioned FIDO2 nowhere, while /proc/cmdline carried
# rd.luks.options=fido2-device=auto the whole time. See docs/skills/fido2.md
# § gpt-auto-generator owns the root's crypt options, and #250.
#
# Why ExecStart is reset and restated: the options are argv[4] of the generated
# ExecStart, not a directive, so there is nothing to append to. From systemd's
# src/shared/generator.c, generator_write_cryptsetup_service_section():
#
#   ExecStart=<SYSTEMD_CRYPTSETUP_PATH> attach '<name>' '<what>' '<key_file>' '<options>'
#
# THIS COUPLES US TO systemd's generated option set. gpt-auto-generator currently adds
# tpm2-device=auto when the OS was measured, plus the two tpm2-measure-* options when it
# also measures the volume key (src/gpt-auto-generator/gpt-auto-generator.c). Both are
# restated below so this override does not silently drop the PCR 15 measurement that
# hardware shows working. If a systemd bump changes that set, this file freezes the old
# one — check it after every systemd update, and prefer deleting this drop-in if upstream
# ever grows a way to extend the options instead of replacing them.
#
# Failure mode if the device path or option syntax ever stops matching: systemd-cryptsetup
# fails and unlock falls back to a passphrase. Degraded, not unbootable.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-cryptsetup attach 'root' '/dev/gpt-auto-root-luks' '' 'fido2-device=auto,tpm2-device=auto,tpm2-measure-pcr=yes,tpm2-measure-keyslot-nvpcr=yes'
