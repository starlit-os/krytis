# Bazaar's "Curated" tab. Read from /run/host/etc/bazaar/curated.yaml (see
# bazaar.yaml); Bazaar watches the file and reloads it live.
#
# Schema: Bazaar 0.9's typed rows (`- banner:` / `- section:`). The legacy
# root-level `css:` + `rows: - sections:` form is rejected by Bazaar 0.9+.
#
# Banners are plain CSS gradients, no `image:`: krytis has no branding art for
# this page. Colours are noctalia's default palette,
# files/noctalia-skel/community-palettes/Rose%20Pine%20Moon.json (dark block for
# dark-color, light block for light-color), from the base colour to one accent.
#
# The app lists mirror the accepted rows of
# docs/design/bazaar-curated-candidates.md, which records why each Bluefin pick
# was kept or dropped. Change a list there first, then here. A list change must
# meet that doc's "Contract with the wiring" rules: every ID resolves on
# Flathub, and no ID is also in blocklist.yaml (the blocklist wins, so the tile
# would silently never render).
rows:
- banner:
    height: 120
    # Rose Pine iris
    dark-color: "linear-gradient(135deg, #232136 0%, #c4a7e7 100%)"
    light-color: "linear-gradient(135deg, #faf4ed 0%, #907aa9 100%)"
- section:
    title:
      en: Krytis Recommends
    subtitle:
      string:
        en: Our favourite applications
    appids:
