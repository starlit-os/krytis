# ostree-prepare-root configuration, installed to /usr/lib/ostree/.
#
# INERT on krytis's current boot path. This file is only read by
# ostree-prepare-root, whose unit is ConditionKernelCommandLine=ostree; krytis
# boots via bootc's composefs backend, which puts composefs=<digest> on the
# cmdline instead, so ostree-prepare-root.service is always skipped
# ("unmet condition check ConditionKernelCommandLine=ostree" in the journal).
#
# In particular [sysroot] readonly does NOT control /sysroot's writability here
# — that comes from the `rw` karg (see 10-root-rw.toml). Do not reach for this
# file when debugging read-only /etc or /var.
#
# Kept because it is the correct configuration if the ostree backend is ever
# used (e.g. a non-composefs install), and costs nothing when skipped.
[composefs]
enabled = yes

[sysroot]
readonly = true
