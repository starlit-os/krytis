# krytis: the system-wide Umbriel config, installed to
# /etc/xdg/umbriel/config.toml by elements/config/umbriel-config.bst.
#
# This is an OVERLAY, not a vendored copy. It includes upstream's own packaged
# default and then sets only the two values krytis needs to differ on. Read
# /usr/share/umbriel/config.toml for the annotated reference of every setting.
#
# Why an overlay (krytis#980). This file used to be all 836 lines of
# noctalia-dev/umbriel's examples/config.toml, vendored once on 2026-09-10
# (#775) with two edits applied. desktop/umbriel.bst tracks refs/heads/main and
# is ref-bumped daily by .github/workflows/track-bst-sources.yml, so upstream's
# 2026-09-16 renames (window-cycle-width -> window-cycle-primary-extent,
# layout.width_presets -> extent_presets, default_width_fraction ->
# default_extent_fraction, window_rule.default_size ->
# default_floating_size_px) silently invalidated six settings here while
# nothing in the tree noticed. `bst source track` cannot re-vendor a data file,
# so a full copy is structurally guaranteed to rot against the binary beside
# it. Upstream's /usr/share/umbriel/config.toml is installed by the same meson
# build as /usr/bin/umbriel (meson.build install_data), so including it is the
# only form of this file that cannot drift.
#
# Merge semantics (src/config/config_merge.cpp, deepMerge): includes are
# expanded first, then this file's values are applied over them. Tables merge
# recursively -- so [keybinds] keeps every upstream bind and only "Mod+Return"
# is replaced, and "Mod+Return" itself merges key-by-key, inheriting upstream's
# repeat/allow_when_inhibited flags while overriding `action`. Non-table values
# and non-table arrays are replaced wholesale, which is what `autostart` below
# relies on. [[window_rule]]-style arrays-of-tables accumulate across files.
#
# A missing include fails closed (src/config/store.h), so a build where
# upstream stops installing its packaged default breaks loudly rather than
# silently dropping every krytis default. `mise run umbriel-config-validate`
# runs `umbriel validate` on this file inside the built image and asserts that
# upstream still ships a [keybinds] table -- without one, the bare [keybinds]
# below would replace the built-in bind set with a single bind.
#
# Users: copy /usr/share/umbriel/config.toml to ~/.config/umbriel/config.toml
# for personal changes (upstream PACKAGING.md's "Configuration lookup"); the
# user file is tier 1 and shadows this file entirely -- lookup is first-match,
# not merged. Or include this file from yours to keep the krytis defaults.

[include]
# Absolute because meson's datadir is compiled into the binary and krytis
# builds with the default prefix=/usr; umbriel-config-validate checks the path
# against the real image rather than trusting this constant.
files = ["/usr/share/umbriel/config.toml"]

[general]
# Upstream ships `autostart = []`. Without noctalia here, noctalia-shell never
# launches under Umbriel and the panel/launcher/lock screen acceptance criteria
# in #775 cannot pass.
autostart = ["noctalia"]

[keybinds]
# Upstream binds kitty, which krytis does not package; krytis ships ghostty as
# its terminal (desktop/ghostty.bst). Only `action` is set, so upstream's own
# flags on this bind are inherited rather than reset.
"Mod+Return" = { action = "spawn:ghostty" }
