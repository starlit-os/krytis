[tool_alias]
# pass-cli has no aqua/asdf backend; resolve the short name to the GitHub backend.
pass-cli = "github:protonpass/pass-cli"

# Every tool is pinned to an exact version so Renovate's mise manager has
# something to bump (#24/#25) — "latest" is invisible to it. Bump by editing
# here, then `mise run mise-lock` to refresh mise.lock.
[tools]
usage = "4.1.0"
# 3.12 is a floor, not a preference: pyproject.toml's requires-python is
# ">=3.12" and BST 2.5.x is validated against it. Crossing to 3.13 is a
# deliberate call, so Renovate is capped below it (allowedVersions in
# .github/renovate.json5).
python = "3.12.13"
uv = "0.12.0"
gum = "0.17.0"
bat = "0.26.1"
# `just` drives the dakota-iso ISO build pipeline (mise run build-iso).
# Sourced from mise (aqua) rather than a BST element — it is dev-host
# tooling, not part of the shipped OS runtime.
just = "1.57.0"
# pass-cli: required by `mise run pull-keys` (#311) to authenticate against the
# Proton Pass vault holding secure boot signing keys. Dev-host tooling only.
# The mise registry has no pass-cli entry, so Renovate's mise manager cannot
# resolve it — a custom.regex manager tracks this line instead.
pass-cli = "2.2.3"
# oras: required by `mise run push` to attach the SBOM (#40) as an OCI
# referrer via `oras attach`. Dev-host tooling only.
oras = "1.3.3"
# grype: required by `mise run vuln-scan` / `mise run push` to scan the SBOM
# for known CVEs (#41). Dev-host tooling only.
grype = "0.116.0"
# cosign: required by `mise run sign` to sign the published image and its
# OCI referrers with Sigstore keyless/OIDC signing (#60). Dev-host tooling
# only — in CI it needs the `id-token: write` job permission for ambient
# GitHub Actions OIDC detection; locally it falls back to an interactive
# browser-based Sigstore login.
cosign = "3.1.2"

[settings]
python.uv_venv_auto = "create|source"
# mise.lock is committed: it carries the checksum + download URL per platform,
# so installs are reproducible and do not need a GITHUB_TOKEN to hit release
# APIs. Lockfiles are never created implicitly — `mise run mise-lock` writes it.
lockfile = true

[deps.uv]
auto = true
sources = ["pyproject.toml", "uv.lock"]
outputs = [".venv/"]
run = "uv sync"

[bootstrap.packages]
"apt:bubblewrap" = "latest"
"apt:lzip" = "latest"
"apt:xz-utils" = "latest"
"apt:bzip2" = "latest"
"apt:gzip" = "latest"
"apt:patch" = "latest"
"dnf:bubblewrap" = "latest"
"dnf:lzip" = "latest"
"dnf:xz" = "latest"
"dnf:bzip2" = "latest"
"dnf:gzip" = "latest"
"dnf:patch" = "latest"

[env]
# { default = "..." } keeps the shell value if already set; only applies the
# fallback when the variable is absent. Requires mise ≥ 2026.6.10.
BST2_IMAGE = { default = "registry.gitlab.com/freedesktop-sdk/infrastructure/freedesktop-sdk-docker-images/bst2:64eb0b4930d57a92710822898fb73af6cc1ae35d" }
BST_MEMORY_LIMIT = { default = "16g" }
VM_RAM = { default = "8192" }
VM_CPUS = { default = "4" }
RUNNER_IMAGE = { default = "localhost/krytis-runner:latest" }
# Kept in lockstep with Containerfile.runner's ARG default by the custom.regex
# manager in .github/renovate.json5 — edit both if you bump it by hand.
RUNNER_VERSION = { default = "2.336.0" }
RUNNER_NAME = { default = "krytis-local" }
RUNNER_LABELS = { default = "self-hosted,linux,x64" }
