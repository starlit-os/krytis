name: Publish krytis image

on:
  schedule:
    # 03:30 UTC, weekdays (#824 option A). Not top-of-the-hour, for the
    # GitHub-scheduler-delay reason in track-bst-sources.yml's comment.
    #
    # Last link in the weekday chain, ~110min after cache-warm.yml's 01:41:
    #   00:13 track -> 01:41 cache-warm -> 03:30 publish (here)
    # `mise run build --pull` reads the same bow cache cache-warm pushes to,
    # so the spacing is what makes a scheduled publish cheap rather than a
    # cold build. cache-warm can run long on a cache-miss day, so a publish
    # that starts before it finishes gets a partially-warmed cache, not a
    # broken one — it still builds, just slower. Revisit the offset if that
    # turns out to be the common case.
    #
    # `1-5` matches cache-warm.yml deliberately. A weekend publish would run
    # against a cache no cache-warm had refreshed that day, which is the one
    # case where the spacing above buys nothing — and it would publish an
    # image built from a tree nobody was around to have merged to.
    #
    # Option B (routing this to the krytis-vps runner) was investigated and
    # declined — see docs/plans/done/2026-09-25-publish-on-krytis-vps-verification.md.
    # This job stays on Blacksmith, which is where every sealed image this
    # project has published was built.
    - cron: '30 3 * * 1-5'
  workflow_dispatch:
    inputs:
      report_only:
        description: 'Report vulnerabilities without blocking the run (default: block on Critical)'
        type: boolean
        default: false
      allow_branch_publish:
        description: 'Permit publishing from a ref other than main (CI testing). The resulting :latest will NOT satisfy the strict main-pinned verification policy — re-publish from main afterwards.'
        type: boolean
        default: false
      publish_sealed:
        description: 'Also build and publish the sealed (signed UKI) image to :sealed. Needs the PROTON_PASS_PAT secret; runs after the unsigned image is published and verified.'
        type: boolean
        default: true
      force_self_hosted:
        description: 'Run on the self-hosted runner instead of Blacksmith'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: krytis-publish
  cancel-in-progress: false

jobs:
  publish:
    # Defaults to Blacksmith; workflow_dispatch can force the self-hosted
    # runner (docs/skills/ci-runner.md) to debug on the real hardware or
    # work around a Blacksmith outage/limit. Nothing else in this job is
    # Blacksmith-specific.
    #
    # Blacksmith is where EVERY sealed image this project has published was
    # built, and those artifacts are hardware-validated. #524 briefly routed
    # sealed runs to the self-hosted runner on a false premise; that runner's
    # container image (ubuntu:24.04, Containerfile.runner) ships no podman at
    # all, so it is the worse host for this job, not the better one.
    #
    # 4 vCPU / 16 GB / 80 GB (documented) since 2026-10-07, down from 8vcpu, to
    # measure what the halved core count costs in build time. The parallelism
    # is unchanged — mise/tasks/bst pins max-jobs 4 with BuildStream's default
    # builders, so the same 16 compile slots now share 16 GB instead of 32.
    # Blacksmith may silently bump a 4vcpu job to 8vcpu when it has spare
    # capacity, so compare runs by the "Record runner size" output, not by
    # the label. See docs/skills/ci-runner.md § Sizing the `publish.yml` runner.
    runs-on: ${{ inputs.force_self_hosted && fromJSON('["self-hosted","linux","x64"]') || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 420
    env:
      # Every `inputs.*` is null on a `schedule` event, so a bare
      # `if: inputs.publish_sealed` would silently skip the whole sealed
      # half of this job on every cron run — republishing :latest and
      # never refreshing :sealed, which is the artifact users actually boot
      # under Secure Boot. Resolved once here rather than repeated at each
      # sealed step, so they cannot drift apart.
      #
      # The other three inputs are safe when null and deliberately left
      # alone: report_only falsy means the severity gate blocks (the strict
      # default), force_self_hosted falsy means Blacksmith, and
      # allow_branch_publish falsy is fine because a scheduled run always
      # carries the default branch, which the ref gate accepts.
      PUBLISH_SEALED: ${{ github.event_name == 'schedule' || inputs.publish_sealed }}
      # The signer identity every verification in this job pins: publish.yml in
      # THIS repo at THIS ref. The older `@refs/heads/.*` accepted a signature
      # from any branch, so a check proved "some branch of this repo signed it"
      # rather than naming one — the run that validated #421 was itself a
      # branch publish, which is how that was noticed. github.ref_name is `main`
      # on the normal path; an opt-in branch publish pins to that branch. The
      # "only main may publish" policy is the ref gate's job, not this one.
      SIGNER_IDENTITY: '^https://github\.com/${{ github.repository }}/\.github/workflows/publish\.yml@refs/heads/${{ github.ref_name }}$'
    steps:
      - name: Gate on ref (only main may publish)
        # FIRST, before build or push. A branch run would push, sign and then
        # promote :latest under a non-main identity: verification pins
        # SIGNER_IDENTITY to the run's own ref, so it cannot catch this. Refusing
        # here means a wrong-ref dispatch costs nothing and the error names the
        # actual cause.
        #
        # allow_branch_publish exists because testing changes to this workflow
        # requires dispatching it from a branch (that is how #421 itself was
        # validated). It is opt-in and loud rather than the default.
        run: |
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "::notice::Publishing from main — signatures will satisfy the strict verification policy"
            exit 0
          fi
          if [[ "${{ inputs.allow_branch_publish }}" != "true" ]]; then
            echo "::error::Refusing to publish from '${{ github.ref_name }}'. Only main may publish."
            echo "  Nothing has been built or pushed."
            echo "  To publish from a branch anyway (CI testing), re-dispatch with allow_branch_publish=true."
            exit 1
          fi
          echo "::warning::Publishing from '${{ github.ref_name }}', not main. \
          The resulting ghcr.io/starlit-os/krytis:latest will be signed with a \
          non-main identity and will NOT verify against the strict policy in \
          docs/skills/signing.md. Re-publish from main afterwards."

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        # Migrated off ublue-os/remove-unwanted-software (#703, untagged
        # upstream broke Renovate). hastd/free-disk-space's bare defaults
        # already cover what extra-squeeze: true used to remove (miniconda +
        # hostedtoolcache) plus more — see docs/skills/ci-runner.md § remove-
        # unwanted-software migration. Same step as cache-warm.yml verbatim,
        # including the deliberate v0.1.1 (not newest v0.1.2) pin — see that
        # workflow's comment for why.
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2

      - name: Record runner size
        # Diagnostic only, so it must never fail the job. The runner label is
        # not proof of size: Blacksmith's "free upgrades" can run a 4vcpu job
        # on an 8vcpu VM, and build-time comparisons need the real numbers.
        run: |
          echo "==> $(nproc) vCPU, $(awk '/MemTotal/ {printf "%.1f", $2/1024/1024}' /proc/meminfo) GiB RAM"
          df -h / || true

      - name: Setup mise
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.24
          experimental: true

      - name: Install system dependencies
        # --update: refresh the apt index first — runner images carry stale
        # package lists, and a superseded .deb 404s on install (#900).
        run: mise bootstrap --yes --update

      - name: Ensure podman is present
        # podman is not declared in mise.toml's [bootstrap.packages]; it is
        # assumed to be baked into the runner. That holds on Blacksmith, whose
        # image mirrors GitHub's ubuntu-24.04 (Podman 4.9.3, Buildah 1.33.7) —
        # which is where every published sealed image has actually been built.
        #
        # It does NOT hold on the self-hosted runner: Containerfile.runner is
        # FROM ubuntu:24.04 and installs no podman, and runner/start mounts none
        # from the host. So a `force_self_hosted=true` dispatch died at
        #   ./mise/tasks/load-image: line 69: podman: command not found
        # (exit 127, run 31126498486). This step is what makes that escape hatch
        # usable at all.
        #
        # `command -v` guard so a runner that already has podman is left alone.
        # Same shape as the install in verify-sealed.yml.
        run: command -v podman >/dev/null || sudo apt-get install -y -qq podman

      - name: Install Python dependencies
        run: uv sync

      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Join tailnet (bow cache)
        # bow's Buildbarn is reachable only as the Tailscale Service
        # bst-cache.werewolf-stonecat.ts.net (materia#163, krytis#1410), so a
        # hosted runner has to join the tailnet before the cache steps below.
        # Workload identity federation: the action trades this job's GitHub
        # OIDC token (id-token: write, above) for an ephemeral tag:ci node,
        # which the tailnet policy lets reach svc:bst-cache's ports and
        # nothing else. No Tailscale secret is stored here: client ID and
        # audience are repo variables, and the credential only accepts
        # subjects repo:starlit-os/krytis:ref:refs/heads/* (no PR runs).
        # Skipped on force_self_hosted: krytis-runner's host is already a
        # tailnet node, and a second tailscaled in the runner would clash.
        if: ${{ !inputs.force_self_hosted }}
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci

      - name: Wait for bow cache over the tailnet
        # The action's README: a new node propagates through the tailnet
        # eventually, and peers refuse it until then. Wait for the Service to
        # resolve and accept TCP rather than letting the cache gate fail on it.
        if: ${{ !inputs.force_self_hosted }}
        run: |
          for i in $(seq 30); do
            if timeout 3 bash -c '</dev/tcp/bst-cache.werewolf-stonecat.ts.net/7982' 2>/dev/null; then
              echo "bow cache reachable after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "::error::bst-cache.werewolf-stonecat.ts.net:7982 unreachable over the tailnet"
          tailscale status || true
          exit 1

      - name: Toolchain cache gate
        # Refuse to start a build that would compile freedesktop-sdk's
        # toolchain (bootstrap/*, llvm, rust): this runner is ephemeral and
        # pull-only, so hours of compiler builds would be thrown away with it.
        # That is what publish run 36552776326 did on 2026-09-29 (878 elements
        # rebuilt, nothing kept). cache-warm builds and pushes the toolchain
        # since #1077, so this only fires when cache-warm has not run since a
        # junction bump or bow lost the artifacts; the error names the fix.
        # It checks bow's storage, not just its index (#1094): bow's index
        # outlived evicted llvm/rust data once, and an index-only check passed.
        env:
          BUILDBARN_PULL_TOKEN: ${{ secrets.BUILDBARN_PULL_TOKEN }}
        run: mise run toolchain-cache-check --pull

      - name: Scan for vulnerabilities (pre-build gate)
        # Runs before the build so a blocking finding aborts here — no BST
        # build time spent, and mise/tasks/push's own scan-before-push
        # (below) is the defense-in-depth guarantee that nothing gets
        # pushed even if this early gate is ever skipped/bypassed (#392).
        # buildstream-sbom reads static element/source metadata via
        # `bst show` — it does not require the image to be built.
        id: vuln-scan
        run: |
          if [[ "${{ inputs.report_only }}" == "true" ]]; then
            echo "::notice::report_only=true — vulnerability scan will not block the build"
            mise run vuln-scan
          else
            mise run vuln-scan --fail-on critical
          fi

      - name: Build oci/krytis/image.bst
        env:
          BUILDBARN_PULL_TOKEN: ${{ secrets.BUILDBARN_PULL_TOKEN }}
        run: mise run build --pull

      - name: Push version tag, attach SBOM + vulnerability report
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --version-only: :latest moves later, in the promote step, and only to
        # a digest whose signature verifies (#1458).
        run: |
          if [[ "${{ inputs.report_only }}" == "true" ]]; then
            echo "::notice::report_only=true — vulnerability scan will not block this run"
            mise run push --version-only
          else
            mise run push --version-only --fail-on critical
          fi

      - name: Sign image with cosign
        # BLOCKING (#1458). This used to be best-effort with continue-on-error
        # (#380): a signing failure left an unsigned :latest public and the run
        # stayed green. That happened once, in run 31158190488 (2026-08-07).
        # Now a failure here stops the job before promotion, so :latest stays
        # on the previous signed image; `mise run sign` retries each artifact
        # first. Recovery is re-dispatching this workflow.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run sign --only image

      - name: Promote :latest to the verified image
        # Verifies the image signature against SIGNER_IDENTITY, then retags the
        # digest. A signature that does not verify fails the job here, which is
        # the only case where the signature problem is genuinely ours (#418).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run promote --identity-regexp "${SIGNER_IDENTITY}"

      - name: Sign SBOM and vulnerability report with cosign
        id: sign-referrers
        # Owner decision on #1458: only the image signature gates promotion. A
        # referrer that fails to sign does not hold :latest back; the job fails
        # at the end instead ('Fail on unsigned referrers'), so the gap shows.
        # Run 32241688624 lost exactly this: a Rekor 409 on the sealed
        # vulnerability report after the image itself had signed.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run sign --only referrers

      - name: Verify SBOM and vulnerability report signatures
        # Blocking when signing claimed success: a referrer signature that does
        # not verify against our own identity is the same class of problem as
        # an image one.
        if: steps.sign-referrers.outcome == 'success'
        run: |
          # shellcheck disable=SC1091
          source krytis-push-digests.env
          verify() {
            local label="$1" digest="$2"
            [[ -z "${digest}" ]] && return 0
            echo "==> Verifying ${label} (${digest})"
            cosign verify \
              --certificate-identity-regexp "${SIGNER_IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "ghcr.io/starlit-os/krytis@${digest}"
          }
          verify "SBOM" "${sbom_digest:-}"
          verify "vulnerability report" "${vuln_digest:-}"

      # ── Sealed image (#448) ────────────────────────────────────────────────
      # Deliberately after the unsigned image is published, signed, verified
      # and promoted: the sealed build is the newer, less-exercised path, and a
      # failure in it must not cost us the primary artifact. Everything below is
      # skipped when publish_sealed=false.
      #
      # Key custody: the six UEFI keys are NOT GitHub secrets. They live in the
      # Proton Pass vault the whole project already uses (fnox.toml), and CI
      # holds exactly one credential — a Proton Pass PAT — to reach them. That
      # keeps raw private key material out of the repository's secret store,
      # makes rotation a vault operation rather than six secret edits, and means
      # a leaked CI secret exposes a revocable token instead of the keys
      # themselves. The keys touch the runner's disk only inside this job and are
      # shredded in the cleanup step below.
      - name: Authenticate to Proton Pass
        if: env.PUBLISH_SEALED == 'true'
        env:
          PROTON_PASS_PAT: ${{ secrets.PROTON_PASS_PAT }}
        run: |
          if [[ -z "${PROTON_PASS_PAT}" ]]; then
            echo "::error::publish_sealed=true but PROTON_PASS_PAT is not set."
            echo "  Create one with 'pass-cli personal-access-token create' and add it as a"
            echo "  repository secret. Format: pst_<token>::<key>."
            exit 1
          fi
          # No liveness probe after this, deliberately. The first real run of this
          # job died on `pass-cli test`: that subcommand exists in 2.2.3 and was
          # removed by 2.2.4, and the help I checked came from a stray 2.2.3 on PATH
          # while mise.lock pins 2.2.4 (84323b8) — whose surface is login/logout/info
          # and no test. `login` already exits non-zero on bad credentials, and the
          # next step is a far better check anyway: `pull-keys` fetches all six
          # secrets and openssl-validates every one.
          pass-cli login --pat "${PROTON_PASS_PAT}"

          # A PAT is granted vault access separately from being created, and without
          # it the run dies ~20 minutes later inside pull-keys with fnox's generic
          # "Check your Proton Pass configuration" — which is how run 30754171738
          # was spent. Catch it here, where the remedy fits in the error message.
          #
          # `vault list --output json` is verified present in the pinned 2.2.4 asset
          # (84323b8), not just in whatever pass-cli answers locally — that mistake
          # is what #452 fixed. What is NOT verified is whether a PAT session may
          # list vaults at all, or the JSON shape it returns, so this only blocks
          # when listing plainly succeeds and the vault is plainly absent. Anything
          # ambiguous warns and falls through to pull-keys, which is the real gate.
          mise run assert-vault-access

      - name: Pull secure boot keys
        if: env.PUBLISH_SEALED == 'true'
        run: mise run pull-keys

      - name: Build and push sealed version tag
        id: push-sealed
        if: env.PUBLISH_SEALED == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A separate digest file: the unsigned push already wrote
        # krytis-push-digests.env and the steps above read it. Overwriting it
        # here would silently re-point the primary image's signature record at
        # the sealed one. --version-only for the same reason as the unsigned
        # push: :sealed moves in the promote step below (#1458).
        run: |
          if [[ "${{ inputs.report_only }}" == "true" ]]; then
            mise run push --sealed --version-only --digest-file krytis-sealed-digests.env
          else
            mise run push --sealed --version-only --fail-on critical --digest-file krytis-sealed-digests.env
          fi

      - name: Sign sealed image with cosign
        # Same contract as the unsigned image: blocking, and :sealed only moves
        # once this succeeds.
        if: env.PUBLISH_SEALED == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run sign --only image --digest-file krytis-sealed-digests.env

      - name: Promote :sealed to the verified image
        if: env.PUBLISH_SEALED == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run promote --sealed --digest-file krytis-sealed-digests.env --identity-regexp "${SIGNER_IDENTITY}"

      - name: Sign sealed SBOM and vulnerability report with cosign
        id: sign-sealed-referrers
        if: env.PUBLISH_SEALED == 'true'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run sign --only referrers --digest-file krytis-sealed-digests.env

      - name: Verify sealed SBOM and vulnerability report signatures
        if: env.PUBLISH_SEALED == 'true' && steps.sign-sealed-referrers.outcome == 'success'
        run: |
          # shellcheck disable=SC1091
          source krytis-sealed-digests.env
          verify() {
            local label="$1" digest="$2"
            [[ -z "${digest}" ]] && return 0
            echo "==> Verifying sealed ${label} (${digest})"
            cosign verify \
              --certificate-identity-regexp "${SIGNER_IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "ghcr.io/starlit-os/krytis@${digest}"
          }
          verify "SBOM" "${sbom_digest:-}"
          verify "vulnerability report" "${vuln_digest:-}"

      - name: Revoke Proton Pass session and wipe keys
        # always(): the keys must not survive a failure either. The runner is
        # ephemeral, but a job that leaves private keys on disk between steps is
        # a habit worth not forming.
        if: always() && env.PUBLISH_SEALED == 'true'
        run: |
          shred -u files/boot-keys/*.key files/boot-keys/*.crt 2>/dev/null || true
          rm -rf files/boot-keys
          pass-cli logout 2>/dev/null || true

      - name: Record disk usage after build
        # Diagnostic only. The BuildStream CAS and podman storage both persist
        # to the end of the job, so this is close to peak usage: the headroom
        # number that decides whether the 80 GB 4vcpu runner disk is enough.
        if: always()
        run: df -h / || true

      - name: Report severity gate outcome
        if: always()
        run: |
          if [[ "${{ steps.push.outcome }}" == "success" ]]; then
            echo "::notice::Push passed the severity gate ($([[ '${{ inputs.report_only }}' == 'true' ]] && echo 'report-only' || echo 'blocking at Critical')); signing and promotion are reported by their own steps"
          elif [[ "${{ steps.vuln-scan.outcome }}" == "failure" ]]; then
            echo "::error::Vulnerability scan blocked this run before the build started — see the 'Scan for vulnerabilities (pre-build gate)' step above"
            exit 1
          else
            echo "::error::Publish step failed — see logs above (push's own scan-before-push re-check, or a build/push failure)"
            exit 1
          fi

      - name: Fail on unsigned referrers
        # Last, so the sealed half still ran. :latest/:sealed have already moved
        # to signed images (#1458 gates promotion on the image signature only);
        # this makes the unsigned SBOM or vulnerability report visible instead
        # of leaving a green run. A red run also skips verify-sealed.yml, so
        # dispatch it by hand if :sealed moved.
        if: always() && (steps.sign-referrers.outcome == 'failure' || steps.sign-sealed-referrers.outcome == 'failure')
        run: |
          echo "::error::An OCI referrer is unsigned (unsigned half: ${{ steps.sign-referrers.outcome }}, sealed half: ${{ steps.sign-sealed-referrers.outcome }})."
          echo "  The images themselves are signed and promoted. Re-dispatch publish.yml to"
          echo "  publish a fully signed set: a referrer signed outside publish.yml carries"
          echo "  another identity and would not verify against SIGNER_IDENTITY."
          exit 1
