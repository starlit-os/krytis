name: Publish krytis image

on:
  workflow_dispatch:
    inputs:
      report_only:
        description: 'Report vulnerabilities without blocking the run (default: block on Critical)'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: krytis-publish
  cancel-in-progress: false

jobs:
  publish:
    # Blacksmith to start (#380) — no self-hosted fallback input yet. If
    # Blacksmith proves unfeasible (disk/time), swap this to
    # ["self-hosted","linux","x64"] (docs/skills/ci-runner.md); nothing
    # else in this job is Blacksmith-specific.
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 420
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        # This pinned SHA's action.yml only accepts `extra-squeeze` (verified
        # against ublue-os/remove-unwanted-software@695eb75... directly) — the
        # remove-dotnet/remove-android/remove-haskell/remove-codeql inputs
        # cache-warm.yml uses predate this pin and are silently ignored
        # (composite actions warn, not error, on unrecognized inputs). See #389.
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10
        with:
          extra-squeeze: "true"

      - name: Setup mise
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          experimental: true

      - name: Install system dependencies
        run: mise bootstrap --yes

      - name: Install Python dependencies
        run: uv sync

      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Scan for vulnerabilities (pre-build gate)
        # Runs before the build so a blocking finding aborts here — no BST
        # build time spent, and mise/tasks/push's own scan-before-push
        # (below) is the defense-in-depth guarantee that nothing gets
        # pushed even if this early gate is ever skipped/bypassed (#392).
        # buildstream-sbom reads static element/source metadata via
        # `bst show` — it does not require the image to be built.
        id: vuln-scan
        run: |
          if [[ "${{ inputs.report_only }}" == "true" ]]; then
            echo "::notice::report_only=true — vulnerability scan will not block the build"
            mise run vuln-scan
          else
            mise run vuln-scan --fail-on critical
          fi

      - name: Build oci/krytis/image.bst
        env:
          BUILDBARN_PULL_TOKEN: ${{ secrets.BUILDBARN_PULL_TOKEN }}
        run: mise run build --pull

      - name: Push, attach SBOM + vulnerability report
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ inputs.report_only }}" == "true" ]]; then
            echo "::notice::report_only=true — vulnerability scan will not block this run"
            mise run push
          else
            mise run push --fail-on critical
          fi

      - name: Sign image and referrers with cosign (best-effort)
        # Runs regardless of whether either severity gate above tripped.
        # If the pre-build gate or push's own scan-before-push blocked
        # publish, no image was ever pushed — this step then has nothing
        # to sign and cleanly no-ops (continue-on-error absorbs its exit).
        # continue-on-error: signing failure never fails this job (#380
        # design decision: parallel/best-effort, matching dakota's
        # publish-sbom job).
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run sign

      - name: Verify signature (diagnostic, non-blocking)
        if: always()
        continue-on-error: true
        run: |
          if [[ -f krytis-push-digests.env ]]; then
            # shellcheck disable=SC1091
            source krytis-push-digests.env
            cosign verify \
              --certificate-identity-regexp "^https://github\.com/${{ github.repository }}/\.github/workflows/publish\.yml@refs/heads/.*\$" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "ghcr.io/starlit-os/krytis@${image_digest}"
          else
            echo "::warning::krytis-push-digests.env missing — push step likely failed before writing it"
          fi

      - name: Report severity gate outcome
        if: always()
        run: |
          if [[ "${{ steps.push.outcome }}" == "success" ]]; then
            echo "::notice::Publish succeeded (severity gate: $([[ '${{ inputs.report_only }}' == 'true' ]] && echo 'report-only' || echo 'blocking at Critical'))"
          elif [[ "${{ steps.vuln-scan.outcome }}" == "failure" ]]; then
            echo "::error::Vulnerability scan blocked this run before the build started — see the 'Scan for vulnerabilities (pre-build gate)' step above"
            exit 1
          else
            echo "::error::Publish step failed — see logs above (push's own scan-before-push re-check, or a build/push failure)"
            exit 1
          fi
