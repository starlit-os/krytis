name: Vulnerability Diff

# PR gate: does this change introduce a new vulnerability match versus its
# base commit? Scans both the PR head and its base with the same
# `mise run vuln-scan` pipeline used everywhere else (#41), then diffs the
# two Grype reports on (vulnerability id, package name, package version) —
# scripts/vuln-diff.py.
#
# Deliberately scans base fresh in this run rather than reusing a stored
# baseline from vuln-scan.yml's periodic run: a PR's base is often not
# tip-of-main (stacked PRs, older base commits, rebases — see AGENTS.md's
# stacked-PR note), and a stale stored baseline would misreport. Scanning
# both commits fresh is the only version-accurate way to diff. That needs no
# image build (see vuln-scan.yml's header for why that holds).
#
# Shape (#1157): two parallel `scan` jobs (head, base), then `diff`. Wall
# time is the slower scan instead of the sum. Each scan restores Grype's
# installed vulnerability database from the Actions cache (#1156), which
# grype-db-cache.yml refreshes daily on main. Without it, every run's first
# Grype call downloaded and imported the ~3 GB database: ~73s of the head
# scan, against ~8s for the base scan that reused it.
#
# Each scan runs its own commit's own `.grype.yaml`, so a PR that adds or
# removes an ignore rule (like #500/#688) shows up here as fixed/new exactly
# like a real dependency change would — this is real Grype output, not a
# bypass of the ignore mechanism.
#
# Posture: BLOCKING at `critical` since 2026-09-03 (#690), matching
# publish.yml's own pre-build `vuln-scan --fail-on critical` bar. A new
# match below Critical is reported in the job summary and does not fail the
# job, per `mise run vuln-scan --fail-on`'s opt-in philosophy
# (docs/skills/sbom.md § --fail-on / severity gating).
#
# The floor is the *repository variable* NEW_VULN_FAIL_ON, not a value in
# this file (#730), so changing the posture takes no workflow edit and no
# merge — read it here at runtime, never hardcode it back:
#
#   mise run vuln-gate                  # show current posture
#   mise run vuln-gate --set critical   # arm at a floor
#   mise run vuln-gate --clear          # back to report-only
#
# Unset/empty variable = report-only. scripts/vuln-diff.py rejects an
# unrecognized value outright (exit 2) rather than treating it as "no
# floor" — a typo in a variable nobody code-reviews would otherwise
# silently disable the gate. A blocked PR that must land takes a
# .grype.yaml ignore rule (reviewed, in-tree, effective on the same PR),
# not `--clear`; see docs/skills/sbom.md for that call.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: krytis-vuln-diff-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Repository variable (#730): a Grype severity
  # (negligible|low|medium|high|critical) fails the job when the PR
  # introduces a NEW match at/above it. Unset/empty = report only, never
  # fails. Change it with `mise run vuln-gate`, never by editing this line.
  NEW_VULN_FAIL_ON: ${{ vars.NEW_VULN_FAIL_ON }}

jobs:
  scan:
    name: Scan ${{ matrix.side }} for vulnerabilities
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      # Both reports are needed; one failing makes the other pointless.
      fail-fast: true
      matrix:
        side: [head, base]
    steps:
      # Each side checks out its own commit, so each scan runs that commit's
      # own mise.toml, uv.lock and .grype.yaml.
      - name: Checkout PR ${{ matrix.side }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.side == 'head' && github.event.pull_request.head.sha || github.event.pull_request.base.sha }}

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.6
          experimental: true

      # Restore only: grype-db-cache.yml on main is the one writer. Caches
      # saved by a PR run are visible to that PR alone, so a save here would
      # only multiply ~0.5 GB entries without helping any other PR. The
      # restored database may be up to a day old; Grype still checks for a
      # newer one (at most every 2h, db.max-update-check-frequency) and
      # downloads it if there is one, so a run never scans a stale database.
      - name: Date for the Grype DB cache key
        id: grype-db
        run: echo "today=$(date -u +%F)" >> "${GITHUB_OUTPUT}"

      - name: Restore Grype vulnerability database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/grype/db
          key: grype-db-v6-${{ steps.grype-db.outputs.today }}
          restore-keys: grype-db-v6-

      - name: Install system dependencies
        # --update: refresh the apt index first — runner images carry stale
        # package lists, and a superseded .deb 404s on install (#900).
        run: mise bootstrap --yes --update

      - name: Install Python dependencies
        run: uv sync

      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Scan PR ${{ matrix.side }} for vulnerabilities
        # Written outside the repo tree (runner.temp).
        run: |
          mise run vuln-scan --output "${{ runner.temp }}/${{ matrix.side }}-grype.json"
          # Which database the scan used, for the run log: proves whether
          # the restored copy was current or Grype had to update it.
          grype db status 2>&1 | grep -E '^(Built|Status):' || true

      - name: Upload ${{ matrix.side }} report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vuln-diff-scan-${{ matrix.side }}
          path: ${{ runner.temp }}/${{ matrix.side }}-grype.json
          retention-days: 1
          if-no-files-found: error

  diff:
    # This job's name is the required status check in ruleset "Main"
    # ("Diff vulnerabilities vs base"). Keep it exactly.
    name: Diff vulnerabilities vs base
    needs: scan
    # always(): a required check that is SKIPPED counts as passing. If a scan
    # failed and this job were skipped, the PR would be mergeable with no
    # diff at all. The first step turns a failed scan into a failure here.
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Require both scans
        if: needs.scan.result != 'success'
        run: |
          echo "::error::A vulnerability scan did not succeed (scan result: ${{ needs.scan.result }}); no diff to report."
          exit 1

      # HEAD's copy of the diff tool, never the base's: an older base commit
      # (stacked PR, pre-rebase) may not carry the current version, or any.
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: scripts/vuln-diff.py
          sparse-checkout-cone-mode: false

      - name: Download both reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vuln-diff-scan-*
          merge-multiple: true
          path: ${{ runner.temp }}

      - name: Report gate posture
        # State the posture in the summary, because "no failure" is
        # ambiguous on its own — report-only and "blocking, nothing found"
        # look identical otherwise.
        #
        # Written to the step log as well as the summary, deliberately:
        # $GITHUB_STEP_SUMMARY content is not retrievable through the REST
        # API (only rendered in the web UI), so the log is the only copy a
        # later `gh run view --log` — or an agent verifying that the
        # repository variable actually reached the run — can read.
        #
        # The fork branch is not hypothetical hedging: repository variables
        # are NOT passed to `pull_request` runs from a forked repo (GitHub
        # community discussion 44322), so the floor reads empty there and
        # this gate cannot block, however it is configured. Fixing that
        # would mean `pull_request_target`, which runs fork-authored code
        # with the base repo's token — not a trade this gate is worth. Say
        # so loudly instead of failing open in silence.
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if [ -n "${NEW_VULN_FAIL_ON}" ]; then
            POSTURE="Gate: **blocking** — a new match at or above \`${NEW_VULN_FAIL_ON}\` fails this job."
          elif [ "${IS_FORK}" = "true" ]; then
            POSTURE=":warning: Gate: **report only, and cannot be enforced** — repository variables are not passed to \`pull_request\` runs from a fork, so \`NEW_VULN_FAIL_ON\` is unreadable here even if set. Review the diff below by hand."
          else
            POSTURE="Gate: **report only** — \`NEW_VULN_FAIL_ON\` is unset (see #690). Set it with \`mise run vuln-gate --set <severity>\`."
          fi
          printf '%s\n' "$POSTURE" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Diff vulnerability reports
        # Standard library only, so the runner's python3 does; no mise or
        # uv setup in this job.
        run: |
          python3 scripts/vuln-diff.py \
            "${{ runner.temp }}/base-grype.json" \
            "${{ runner.temp }}/head-grype.json" \
            --fail-on "${NEW_VULN_FAIL_ON}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload head/base vulnerability reports
        if: always() && needs.scan.result == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: krytis-vuln-diff-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/base-grype.json
            ${{ runner.temp }}/head-grype.json
          retention-days: 30
          if-no-files-found: error
