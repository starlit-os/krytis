name: Warm BST Cache

on:
  schedule:
    # 01:41 UTC, not top-of-the-hour (see track-bst-sources.yml's cron
    # comment — same GitHub-scheduler-delay finding, both workflows were on
    # '0 6' and drifted in lockstep). ~90min after track-bst-sources.yml's
    # 00:13: once tracking PRs auto-merge (not yet, see that file's comment),
    # this gives same-day tracked updates a window to land in main before
    # cache-warm builds and warms bow's cache — no point warming a cache for
    # a tree that's about to change under it.
    #
    # Moved 5h earlier (was 06:41) with the rest of the chain in #824, which
    # added publish.yml's own schedule downstream of this one:
    #   00:13 track -> 01:41 cache-warm (here) -> 03:30 publish
    # The 90min spacing above is unchanged; publish sits a further ~110min
    # out. Weekday-only is also unchanged, and publish.yml matches it
    # (`30 3 * * 1-5`) so neither runs against a cache the other skipped.
    - cron: '41 1 * * 1-5'
  workflow_dispatch:
    inputs:
      force_blacksmith:
        description: 'Run on Blacksmith instead of the always-on VPS runner (maintenance/outage fallback)'
        type: boolean
        default: false

permissions: read-all

concurrency:
  group: krytis-cache-warm
  cancel-in-progress: false

jobs:
  warm-cache:
    # Defaults to the always-on Debian VPS runner (issue #794) — an
    # unattended cron job needs an unattended runner, unlike the local
    # container runner (mise runner:*) it replaced here, which is mostly off.
    # workflow_dispatch can force Blacksmith as the manual fallback for VPS
    # maintenance or an outage (inverts the old Blacksmith-default/
    # self-hosted-opt-in direction). Build concurrency is derived from the
    # runner's cores AND its RAM — see the comment further down.
    #
    # Targets the 'krytis-vps' label specifically, not the bare
    # [self-hosted, linux, x64] the local container runner also registers
    # under (mise.toml RUNNER_LABELS) — the two would otherwise be
    # indistinguishable to this ternary whenever both happened to be online,
    # making routing nondeterministic. See docs/skills/ci-runner.md § Always-on VPS runner.
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && inputs.force_blacksmith) && 'blacksmith-8vcpu-ubuntu-2404' || fromJSON('["self-hosted","linux","x64","krytis-vps"]') }}
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The persistent VPS accumulates state between jobs that an ephemeral
      # runner never would. Condition mirrors the runs-on ternary above
      # deliberately: same expression, same two hosts.
      - name: Clear stale FUSE mounts (self-hosted)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.force_blacksmith) }}
        run: |
          # buildbox-fuse mounts under the CAS outlive a killed build: an
          # OOM-killed (or cancelled) job leaves the mountpoint present but
          # its server gone, and every later `df` on this persistent box then
          # exits 1 with "Transport endpoint is not connected" — which is
          # exactly how run 34696760836 failed before reaching the build.
          # Now that OOMPolicy=continue keeps the runner alive across a kill,
          # this residue is guaranteed to survive into the next job.
          STALE=0
          for m in $(awk '$2 ~ /buildstream/ && $3 ~ /fuse/ {print $2}' /proc/self/mounts); do
            # `stat -f` (statfs), NOT `stat`. A dead FUSE mount still answers
            # stat() from the dentry cache — run 34746389718 reported
            # "Cleared 0" while df failed on a mount listed right there in
            # /proc/self/mounts, because stat() succeeded on it. statfs() is
            # what df itself calls and what returns ENOTCONN.
            if ! timeout 5 stat -f "${m}" >/dev/null 2>&1; then
              echo "Unmounting stale FUSE mount: ${m}"
              # umount -l first: fusermount is not installed on this box (no
              # `fuse` package — buildbox-fuse ships its own), so the
              # fusermount path never fired and only the fallback ever worked.
              umount -l "${m}" 2>/dev/null || fusermount -u "${m}" 2>/dev/null || true
              STALE=$((STALE + 1))
            fi
          done
          echo "==> Cleared ${STALE} stale FUSE mount(s)."

      - name: Maximize build space
        # Blacksmith only. This action is built for a throwaway GitHub-hosted
        # runner: it deletes system paths to reclaim space and runs
        # `swapoff -a && rm -f /mnt/swapfile`. On the persistent VPS the first
        # is pointless (124G free of 197G) and the second actively disables
        # the swap provision.sh adds as OOM headroom — undoing, at the start
        # of every run, the backstop this workflow now depends on.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.force_blacksmith }}
        # ublue-os/remove-unwanted-software has had no push since 2025-10-10
        # and no v10 tag was ever cut, breaking Renovate's github-tags lookup
        # (#703). hastd/free-disk-space is properly tagged, actively
        # maintained, and its bare defaults already free more space than the
        # old action's fixed removal list ever did with these inputs — see
        # docs/skills/ci-runner.md § *`remove-unwanted-software` → `free-disk-space` migration* for
        # the full path-by-path comparison.
        #
        # Deliberately pinned to v0.1.1, not the newest v0.1.2: the two
        # releases are behaviorally identical for us (v0.1.2 only adds an
        # opt-in skip-if-available input, unused here), so this leaves
        # Renovate a real minor bump to open and auto-merge as proof the
        # github-tags lookup that broke on the old action now actually
        # works end-to-end.
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5 # v0.1.2

      # `version:` is not cosmetic on this job. Without it mise-action skips
      # setup entirely whenever a mise binary already exists — which on this
      # persistent VPS is whatever version first landed here, forever. Run
      # 35461887730 failed on exactly that: the box was still on 2026.9.5
      # while every ephemeral runner had 2026.9.11, and 2026.9.5 predates
      # jdx/mise#13128, which stops `minimum_release_age` (default 24h) from
      # rejecting a version already committed to mise.lock. usage@6.10.0
      # merged 3h after release, the hosted runners installed it, this one
      # refused. With a pin, mise-action self-updates a mismatched binary.
      # See docs/skills/ci-runner.md § Pin the mise version, not just the action.
      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.9.12
          experimental: true

      - name: Install system dependencies
        # --update: refresh the apt index first — runner images carry stale
        # package lists, and a superseded .deb 404s on install (#900).
        run: mise bootstrap --yes --update

      - name: Install Python dependencies
        run: uv sync

      - name: Generate image version
        run: mise run generate-image-version

      - name: Configure BuildStream
        env:
          BUILDBARN_PUSH_TOKEN: ${{ secrets.BUILDBARN_PUSH_TOKEN }}
          BUILDBARN_PULL_TOKEN: ${{ secrets.BUILDBARN_PULL_TOKEN }}
        run: |
          mkdir -p ~/.config
          # Total concurrent compile processes = builders x max-jobs, and that
          # product — not max-jobs alone — is what has to fit in the runner's
          # RAM. Sizing max-jobs to $(nproc) (d5bf7f6) while leaving builders
          # at 4 asked the 6-vCPU/11GiB VPS for up to 24 of them and OOM-killed
          # the runner twice inside 24h (11.4G and 11.1G peaks against 11GiB
          # with no swap, 2026-09-11/12 — see docs/skills/ci-runner.md
          # § The VPS runner OOMs). cc1plus peaked at 1.5G RSS in the kill
          # log, so budget 2 GiB per slot and never exceed one slot per core:
          CORES=$(nproc)
          MEM_GB=$(awk '/MemTotal/ {printf "%d", $2/1024/1024}' /proc/meminfo)
          SLOTS=$(( MEM_GB / 2 ))
          [ "${SLOTS}" -gt "${CORES}" ] && SLOTS=${CORES}
          [ "${SLOTS}" -lt 1 ] && SLOTS=1
          # 2 builders keeps the scheduler able to overlap a slow element with
          # a fast one (the dependency chain is mostly sequential, so more than
          # that buys little) while halving the per-element job count.
          BUILDERS=2
          [ "${BUILDERS}" -gt "${SLOTS}" ] && BUILDERS=${SLOTS}
          MAX_JOBS=$(( (SLOTS + BUILDERS - 1) / BUILDERS ))
          echo "==> ${CORES} cores, ${MEM_GB}GiB RAM -> builders=${BUILDERS} max-jobs=${MAX_JOBS} (<=${SLOTS} concurrent compilers)"

          cat > ~/.config/buildstream.conf <<EOF
          scheduler:
            fetchers: 10
            builders: ${BUILDERS}
            pushers: 5
            network-retries: 3
          logging:
            key-length: 8
            verbose: False
          cache:
            quota: 50G
          build:
            # max-jobs's runtime env vars (MAKEFLAGS/JOBS for autotools/meson,
            # LTOJOBS for freedesktop-sdk's own meson-conf.yml) are all
            # explicitly excluded from the cache key via environment-nocache —
            # verified against the pinned freedesktop-sdk ref and the upstream
            # buildstream_plugins package (see docs/skills/ci-runner.md
            # § max-jobs does NOT affect cache keys) — so sizing this per
            # runner costs nothing in cache reproducibility. What it does cost
            # is RAM, which is why it is derived above rather than set to
            # $(nproc) outright.
            max-jobs: ${MAX_JOBS}
          EOF

          # Wire krytis's bow Buildbarn cache into user config (#340). Not
          # declared in project.conf at all — bow requires a bearer token for
          # every RPC, read or write, and no token is ever committed to this
          # repo, so a project.conf entry could never authenticate. Push and
          # pull are minted as separate JWT roles (materia's
          # `mise buildbarn:mint-token --role push|pull`); prefer push when
          # available since a push-capable connection also serves reads,
          # falling back to a pull-only token so cache-warm still benefits
          # from bow's existing cache even when push isn't configured (e.g.
          # secret not yet provisioned, or rotated out). Both degrade
          # gracefully to a plain build with no bow entries if neither secret
          # is set.
          if [ -n "${BUILDBARN_PUSH_TOKEN}" ]; then
            TOKEN_FILE="${RUNNER_TEMP}/buildbarn-token"
            printf '%s' "${BUILDBARN_PUSH_TOKEN}" > "${TOKEN_FILE}"
            chmod 600 "${TOKEN_FILE}"
            PUSH_FLAG="true"
            echo "::notice::Buildbarn push wired — sources/artifacts will push to bow as they build"
          elif [ -n "${BUILDBARN_PULL_TOKEN}" ]; then
            TOKEN_FILE="${RUNNER_TEMP}/buildbarn-token"
            printf '%s' "${BUILDBARN_PULL_TOKEN}" > "${TOKEN_FILE}"
            chmod 600 "${TOKEN_FILE}"
            PUSH_FLAG="false"
            echo "::notice::Buildbarn pull wired — cache-warm will read from bow but not push"
          else
            TOKEN_FILE=""
            echo "::warning::Neither BUILDBARN_PUSH_TOKEN nor BUILDBARN_PULL_TOKEN set — cache-warm will build without bow"
          fi

          if [ -n "${TOKEN_FILE}" ]; then
            cat >> ~/.config/buildstream.conf <<EOF2
          artifacts:
            servers:
            - url: https://bst-cache.ririi.dev:7981
              type: index
              push: ${PUSH_FLAG}
              auth:
                server-cert: ${GITHUB_WORKSPACE}/quadlet/buildbarn/certs/bow-server.crt
                access-token: ${TOKEN_FILE}
            - url: https://bst-cache.ririi.dev:7982
              type: storage
              push: ${PUSH_FLAG}
              auth:
                server-cert: ${GITHUB_WORKSPACE}/quadlet/buildbarn/certs/bow-server.crt
                access-token: ${TOKEN_FILE}

          source-caches:
            servers:
            - url: https://bst-cache.ririi.dev:7981
              type: index
              push: ${PUSH_FLAG}
              auth:
                server-cert: ${GITHUB_WORKSPACE}/quadlet/buildbarn/certs/bow-server.crt
                access-token: ${TOKEN_FILE}
            - url: https://bst-cache.ririi.dev:7982
              type: storage
              push: ${PUSH_FLAG}
              auth:
                server-cert: ${GITHUB_WORKSPACE}/quadlet/buildbarn/certs/bow-server.crt
                access-token: ${TOKEN_FILE}
          EOF2
          fi

      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      # -x fuse: buildbox-fuse staging mounts whose server has exited make a
      # plain `df` exit 1 ("Transport endpoint is not connected") and, on a
      # persistent runner, that killed two jobs outright — 34696760836 before
      # the build and 34723320921 after it. A *diagnostic* step must never
      # decide whether the build runs. The `|| true` is belt-and-braces: a
      # mount can go stale between df reading /proc/self/mounts and statfs-ing
      # it, and the number worth printing is the real filesystem's, which -x
      # already isolates.
      - name: Print disk usage before build
        run: df -h -x fuse || true

      - name: Build image
        run: |
          # --retry-failed matches mise/tasks/load-image: a cached failed
          # artifact is pulled and re-reported in 0s otherwise, so cache-warm
          # would keep re-publishing yesterday's failure instead of rebuilding.
          #
          # Failure is fatal (#741). This step used to `set +e` … `exit 0` as
          # "non-blocking", which bought nothing: artifacts push to bow as they
          # build (`push:` above), so everything cached before the failure is
          # already uploaded when bst exits, and both reporting steps below run
          # under `if: always()`. All the swallow achieved was a green tick on a
          # tree that cannot build — run 33872185343 passed 9 minutes before
          # publish run 33872670405 died on the same broken element. cache-warm
          # is the only scheduled job that compiles elements at all (`Checks` is
          # static-only), so its result has to mean something.
          uv run bst -o x86_64_v3 true --no-interactive build --retry-failed oci/krytis/image.bst

      - name: Print disk usage after build
        if: always()
        run: |
          df -h -x fuse || true
          du -sh ~/.cache/buildstream 2>/dev/null || true

      - name: Report cached elements
        if: always()
        run: |
          CACHED=$(uv run bst show --deps all --format '%{name} %{state}' oci/krytis/image.bst 2>/dev/null | grep -c "cached" || echo 0)
          echo "::notice::Cached elements: ${CACHED}"
