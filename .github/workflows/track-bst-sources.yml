name: Track BuildStream Sources

on:
  schedule:
    # :13, not top-of-the-hour: GitHub's scheduler is documented to delay
    # :00-triggered crons under load, and this repo's own history shows that
    # delay growing from ~20min to ~4-5h over a few weeks (both this and
    # cache-warm.yml were on '0 6' and drifted in lockstep every day — see
    # docs/skills/ci-runner.md § *Scheduled Workflow Cron Delay*).
    #
    # The 00:13 run is the head of the daily chain, and the whole chain
    # moved 5h earlier in #824 so that the scheduled publish it now feeds
    # lands in the maintainer's morning rather than mid-afternoon:
    #   00:13 track (here) -> 01:41 cache-warm -> 03:30 publish
    # The relative spacing is unchanged; only the start moved. Tracking
    # stays first because these jobs open PRs, cache-warm builds the image,
    # and once tracking PRs auto-merge (not yet — no auto-merge group exists
    # today, see docs/design/renovate-expansion.md and
    # docs/plans/done/2026-06-17-ci-workflows.md § Future: auto-merge)
    # cache-warm should build *after* today's tracked updates have had a
    # chance to land, not before.
    #
    # Every other hour is outside that chain: cache-warm and publish still
    # run once a day. The hourly passes exist for the 24h cooldown
    # (scripts/tracking-cooldown.sh): a PR leaves draft within about an hour
    # of Ready-At, and a new release is first seen within about an hour of
    # publication. They are cheap because a run that finds nothing new
    # pushes nothing and edits nothing (scripts/commit-tracking-update.sh,
    # scripts/tracking-pr.sh), so open tracking PRs see no synchronize and
    # their checks don't re-run.
    - cron: '13 * * * *'
  workflow_dispatch:
    inputs:
      group:
        description: 'Which element group to track'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linux-cachyos
          - mise
          - gum
          - pangolin
          - proton-pass
          - microsoft-dbx
          - niri
          - ghostty
          - seance
          - symbols-nerd-font
          - manual-merge
          - core-junctions
          - game-devices-udev
          - papirus-icon-theme
          - noctalia
          - noctalia-greeter
          - umbriel
          - xdg-desktop-portal-umbriel
          - md4c
          - stb
          - libsodium
          - falcond
          - falcond-profiles
          - scx-loader
          - chunkah
          - zen-browser
          - kmscon
          - libtsm
          - qemu
          - qemu-image
          - tarball
          - libqalculate
          - ananicy-cpp
          - spdlog

permissions: read-all

# One run at a time. Scheduled runs start hours late under load, so hourly
# crons can queue up; two overlapping runs would both rewrite the same
# tracking branches and their cooldown trailers. Not cancelled: a run killed
# between moving a branch and updating its PR leaves them disagreeing.
# GitHub keeps one pending run per group and drops older pending ones,
# which only loses a pass the next hour repeats.
concurrency:
  group: track-bst-sources
  cancel-in-progress: false

# Every job sets BRANCH once, for both "Apply tracking cooldown" and "Create or
# update PR". The cooldown step must run before anything reads the new
# version: while the branch's open PR is pending, it puts that PR's update
# back into the working tree, so the title and body describe what gets
# committed (scripts/tracking-cooldown.sh, #1271).
jobs:
  track-linux-cachyos:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    if: >-
      github.event.inputs.group == 'all' ||
      github.event.inputs.group == 'linux-cachyos' ||
      github.event_name == 'schedule'
    env:
      BRANCH: auto/track-linux-cachyos
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate tracking bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TRACKING_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRACKING_APP_PRIVATE_KEY }}

      - name: Setup mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.17
          experimental: true

      - name: Read current version
        id: current
        run: |
          ELEMENT="elements/core/linux-cachyos.bst"
          VER=$(awk '/^  version:/{gsub(/"/, "", $2); print $2}' "$ELEMENT")
          REL=$(awk '/^  pkgrel:/{gsub(/"/, "", $2); print $2}' "$ELEMENT")
          echo "version=${VER}-${REL}" >> "$GITHUB_OUTPUT"

      - name: Update linux-cachyos element
        run: mise run kernel-update

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet elements/core/linux-cachyos.bst; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Apply tracking cooldown
        if: steps.changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/tracking-cooldown.sh "$BRANCH" elements/core/linux-cachyos.bst

      - name: Read new version
        if: steps.changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        id: new
        run: |
          ELEMENT="elements/core/linux-cachyos.bst"
          VER=$(awk '/^  version:/{gsub(/"/, "", $2); print $2}' "$ELEMENT")
          REL=$(awk '/^  pkgrel:/{gsub(/"/, "", $2); print $2}' "$ELEMENT")
          echo "version=${VER}-${REL}" >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        if: steps.changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          OLD_VER="${{ steps.current.outputs.version }}"
          NEW_VER="${{ steps.new.outputs.version }}"
          TITLE="chore(deps): update linux-cachyos ${OLD_VER} -> ${NEW_VER}"

          printf '%s\n' "$TITLE" > /tmp/commit-msg.txt
          bash scripts/commit-tracking-update.sh "$BRANCH" /tmp/commit-msg.txt elements/core/linux-cachyos.bst

          {
            echo "## linux-cachyos update: \`${OLD_VER}\` → \`${NEW_VER}\`"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Source** | [CachyOS/linux-cachyos](https://github.com/CachyOS/linux-cachyos) |"
            echo "| **Version** | \`${OLD_VER}\` → \`${NEW_VER}\` |"
            echo "| **Releases** | [https://github.com/CachyOS/linux-cachyos/releases](https://github.com/CachyOS/linux-cachyos/releases) |"
            echo ""
            echo "---"
            echo "*Generated by [Track BuildStream Sources](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"
          } > /tmp/pr-body.md

          bash scripts/tracking-pr.sh "$BRANCH" "$TITLE" /tmp/pr-body.md

  track-mise:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    if: >-
      github.event.inputs.group == 'all' ||
      github.event.inputs.group == 'mise' ||
      github.event_name == 'schedule'
    env:
      BRANCH: auto/track-mise
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate tracking bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TRACKING_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRACKING_APP_PRIVATE_KEY }}

      - name: Setup mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.17
          experimental: true

      - name: Read current version
        id: current
        run: |
          echo "version=$(grep -oP 'download/v\K[^/]+' elements/core/mise.bst | head -1)" >> "$GITHUB_OUTPUT"

      - name: Update mise element
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run mise-update

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet elements/core/mise.bst; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Apply tracking cooldown
        if: steps.changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/tracking-cooldown.sh "$BRANCH" elements/core/mise.bst

      - name: Read new version
        if: steps.changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        id: new
        run: |
          echo "version=$(grep -oP 'download/v\K[^/]+' elements/core/mise.bst | head -1)" >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        if: steps.changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          OLD_VER="${{ steps.current.outputs.version }}"
          NEW_VER="${{ steps.new.outputs.version }}"
          TITLE="chore(deps): update mise ${OLD_VER} -> ${NEW_VER}"

          printf '%s\n' "$TITLE" > /tmp/commit-msg.txt
          bash scripts/commit-tracking-update.sh "$BRANCH" /tmp/commit-msg.txt elements/core/mise.bst

          {
            echo "## mise update: \`${OLD_VER}\` → \`${NEW_VER}\`"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Source** | [jdx/mise](https://github.com/jdx/mise) |"
            echo "| **Version** | \`${OLD_VER}\` → \`${NEW_VER}\` |"
            echo "| **Releases** | [https://github.com/jdx/mise/releases](https://github.com/jdx/mise/releases) |"
            echo ""
            echo "---"
            echo "*Generated by [Track BuildStream Sources](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"
          } > /tmp/pr-body.md

          bash scripts/tracking-pr.sh "$BRANCH" "$TITLE" /tmp/pr-body.md

  track-microsoft-dbx:
    # Not a BST source, but the same staleness problem and the same remedy: an
    # out-of-date dbx silently keeps trusting Microsoft-signed binaries that have
    # since been revoked, and nothing fails to tell you (#446). Microsoft adds
    # revocations on their own schedule, so this has to be pulled, not pinned.
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    if: >-
      github.event.inputs.group == 'all' ||
      github.event.inputs.group == 'microsoft-dbx' ||
      github.event_name == 'schedule'
    env:
      BRANCH: auto/track-microsoft-dbx
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate tracking bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TRACKING_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRACKING_APP_PRIVATE_KEY }}

      - name: Setup mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.17
          experimental: true

      - name: Read current revocation count
        id: current
        run: |
          echo "count=$(python3 scripts/parse-efi-auth.py --count-esl files/microsoft-uefi-certs/dbx.esl 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: Fetch Microsoft's revocation list
        run: mise run fetch-microsoft-dbx

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet files/microsoft-uefi-certs/dbx.bin files/microsoft-uefi-certs/dbx.esl; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Apply tracking cooldown
        if: steps.changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/tracking-cooldown.sh "$BRANCH" files/microsoft-uefi-certs/dbx.bin files/microsoft-uefi-certs/dbx.esl

      - name: Read new revocation count
        if: steps.changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        id: new
        run: |
          echo "count=$(python3 scripts/parse-efi-auth.py --count-esl files/microsoft-uefi-certs/dbx.esl 2>/dev/null || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        if: steps.changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          OLD_CNT="${{ steps.current.outputs.count }}"
          NEW_CNT="${{ steps.new.outputs.count }}"
          TITLE="chore(deps): update Microsoft dbx ${OLD_CNT} -> ${NEW_CNT} revocations"

          printf '%s\n' "$TITLE" > /tmp/commit-msg.txt
          bash scripts/commit-tracking-update.sh "$BRANCH" /tmp/commit-msg.txt files/microsoft-uefi-certs/dbx.bin files/microsoft-uefi-certs/dbx.esl

          {
            echo "## Microsoft dbx update: \`${OLD_CNT}\` → \`${NEW_CNT}\` revoked hashes"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Source** | [microsoft/secureboot_objects](https://github.com/microsoft/secureboot_objects) |"
            echo "| **File** | \`PostSignedObjects/SignedByKEK2023/dbx_x64.efiauth2\` |"
            echo "| **Revocations** | \`${OLD_CNT}\` → \`${NEW_CNT}\` |"
            echo ""
            echo "The payload is re-signed with krytis's KEK at build time — Microsoft signs"
            echo "theirs with Microsoft's KEK, which krytis does not enrol. \`dbx.esl\` is the"
            echo "union of this list and what was already committed, so an upstream prune"
            echo "cannot reduce what krytis revokes (#755) — expect it to carry more entries"
            echo "than \`dbx.bin\`."
            echo ""
            echo "**Verify before merging:** \`mise run seal-uki && mise run enroll-test\`"
            echo "should report a \`dbx\` blob matching the new payload size."
            echo ""
            echo "---"
            echo "*Generated by [Track BuildStream Sources](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"
          } > /tmp/pr-body.md

          bash scripts/tracking-pr.sh "$BRANCH" "$TITLE" /tmp/pr-body.md

  track-gum:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    if: >-
      github.event.inputs.group == 'all' ||
      github.event.inputs.group == 'gum' ||
      github.event_name == 'schedule'
    env:
      BRANCH: auto/track-gum
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate tracking bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TRACKING_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRACKING_APP_PRIVATE_KEY }}

      - name: Setup mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.17
          experimental: true

      - name: Read current version
        id: current
        run: |
          echo "version=$(grep -oP 'gum_\K[^_]+(?=_Linux)' elements/core/gum.bst | head -1)" >> "$GITHUB_OUTPUT"

      - name: Update gum element
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run gum-update

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet elements/core/gum.bst; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Apply tracking cooldown
        if: steps.changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/tracking-cooldown.sh "$BRANCH" elements/core/gum.bst

      - name: Read new version
        if: steps.changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        id: new
        run: |
          echo "version=$(grep -oP 'gum_\K[^_]+(?=_Linux)' elements/core/gum.bst | head -1)" >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        if: steps.changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          OLD_VER="${{ steps.current.outputs.version }}"
          NEW_VER="${{ steps.new.outputs.version }}"
          TITLE="chore(deps): update gum ${OLD_VER} -> ${NEW_VER}"

          printf '%s\n' "$TITLE" > /tmp/commit-msg.txt
          bash scripts/commit-tracking-update.sh "$BRANCH" /tmp/commit-msg.txt elements/core/gum.bst

          {
            echo "## gum update: \`${OLD_VER}\` → \`${NEW_VER}\`"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Source** | [charmbracelet/gum](https://github.com/charmbracelet/gum) |"
            echo "| **Version** | \`${OLD_VER}\` → \`${NEW_VER}\` |"
            echo "| **Releases** | [https://github.com/charmbracelet/gum/releases](https://github.com/charmbracelet/gum/releases) |"
            echo ""
            echo "---"
            echo "*Generated by [Track BuildStream Sources](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"
          } > /tmp/pr-body.md

          bash scripts/tracking-pr.sh "$BRANCH" "$TITLE" /tmp/pr-body.md

  track-libsodium:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    if: >-
      github.event.inputs.group == 'all' ||
      github.event.inputs.group == 'libsodium' ||
      github.event_name == 'schedule'
    env:
      BRANCH: auto/track-libsodium
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate tracking bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TRACKING_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRACKING_APP_PRIVATE_KEY }}

      - name: Setup mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.17
          experimental: true

      - name: Read current version
        id: current
        run: |
          echo "version=$(grep -oP 'libsodium-\K[0-9.]+(?=\.tar\.gz)' elements/desktop/libsodium.bst | head -1)" >> "$GITHUB_OUTPUT"

      - name: Update libsodium element
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run libsodium-update

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet elements/desktop/libsodium.bst; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Apply tracking cooldown
        if: steps.changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/tracking-cooldown.sh "$BRANCH" elements/desktop/libsodium.bst

      - name: Read new version
        if: steps.changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        id: new
        run: |
          echo "version=$(grep -oP 'libsodium-\K[0-9.]+(?=\.tar\.gz)' elements/desktop/libsodium.bst | head -1)" >> "$GITHUB_OUTPUT"

      - name: Create or update PR
        if: steps.changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          OLD_VER="${{ steps.current.outputs.version }}"
          NEW_VER="${{ steps.new.outputs.version }}"
          TITLE="chore(deps): update libsodium ${OLD_VER} -> ${NEW_VER}"

          printf '%s\n' "$TITLE" > /tmp/commit-msg.txt
          bash scripts/commit-tracking-update.sh "$BRANCH" /tmp/commit-msg.txt elements/desktop/libsodium.bst

          {
            echo "## libsodium update: \`${OLD_VER}\` → \`${NEW_VER}\`"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Source** | [jedisct1/libsodium](https://github.com/jedisct1/libsodium) |"
            echo "| **Version** | \`${OLD_VER}\` → \`${NEW_VER}\` |"
            echo "| **Releases** | [https://github.com/jedisct1/libsodium/releases](https://github.com/jedisct1/libsodium/releases) |"
            echo ""
            echo "---"
            echo "*Generated by [Track BuildStream Sources](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"
          } > /tmp/pr-body.md

          bash scripts/tracking-pr.sh "$BRANCH" "$TITLE" /tmp/pr-body.md

  track-niri:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    if: >-
      github.event.inputs.group == 'all' ||
      github.event.inputs.group == 'niri' ||
      github.event_name == 'schedule'
    env:
      BRANCH: auto/track-niri
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate tracking bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TRACKING_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRACKING_APP_PRIVATE_KEY }}

      - name: Setup mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.17
          experimental: true

      - name: Read current version
        id: current
        run: |
          echo "version=$(grep -oP 'refs/tags/v\K[^\s/]+(?=\.tar\.gz)' elements/desktop/niri.bst | head -1)" >> "$GITHUB_OUTPUT"

