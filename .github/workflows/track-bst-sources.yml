  # Nine elements pinned to kind: tar / kind: remote, which `bst source track`
  # cannot follow (#648). One matrix job rather than nine near-identical ones —
  # the per-element differences live in the TARGETS table in
  # mise/tasks/tarball-update, so adding an element is a row there plus a name
  # here.
  track-tarball:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    if: >-
      github.event.inputs.group == 'all' ||
      github.event.inputs.group == 'tarball' ||
      github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        name:
          - adw-gtk3
          - cage
          - greetd
          - gtk4-layer-shell
          - sdbus-cpp
          - wlr-randr
          - wlroots
          - buildstream-plugins
          - buildstream-plugins-community
          - zig-0.16
    env:
      BRANCH: auto/track-${{ matrix.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate tracking bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TRACKING_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRACKING_APP_PRIVATE_KEY }}

      - name: Setup mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.17
          experimental: true

      - name: Resolve element path
        id: elem
        run: |
          echo "path=$(mise run tarball-update --list | awk -v n='${{ matrix.name }}' '$1==n {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Update ${{ matrix.name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mise run tarball-update ${{ matrix.name }}

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet "${{ steps.elem.outputs.path }}"; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Apply tracking cooldown
        if: steps.changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/tracking-cooldown.sh "$BRANCH" "${{ steps.elem.outputs.path }}"

      - name: Create or update PR
        if: steps.changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          ELEMENT="${{ steps.elem.outputs.path }}"
          TITLE="chore(deps): update ${{ matrix.name }}"

          printf '%s\n' "$TITLE" > /tmp/commit-msg.txt
          bash scripts/commit-tracking-update.sh "$BRANCH" /tmp/commit-msg.txt "$ELEMENT"

          {
            echo "## ${{ matrix.name }} update"
            echo ""
            echo "\`${ELEMENT}\` — refreshed by \`mise run tarball-update ${{ matrix.name }}\`."
            echo ""
            echo "> [!IMPORTANT]"
            echo "> This job bumps the \`ref:\` but never **builds** the element."
            echo "> An upstream release that adds a dependency will merge green and break"
            echo "> \`mise build\` on \`main\`. Diff the upstream build file before merging —"
            echo "> see \`docs/skills/bst.md\` § Element Update Path."
            echo ""
            echo "---"
            echo "*Generated by [Track BuildStream Sources](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"
          } > /tmp/pr-body.md

          bash scripts/tracking-pr.sh "$BRANCH" "$TITLE" /tmp/pr-body.md
