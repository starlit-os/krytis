            branch: auto/track-spdlog
            title: "chore(deps): update spdlog"

    env:
      BRANCH: ${{ matrix.branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate tracking bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TRACKING_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRACKING_APP_PRIVATE_KEY }}

      - name: Setup mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.17
          experimental: true

      - name: Install system dependencies
        # --update: refresh the apt index first — runner images carry stale
        # package lists, and a superseded .deb 404s on install (#900).
        run: mise bootstrap --yes --update

      - name: Track sources with BuildStream
        run: uv run bst --no-interactive -o x86_64_v3 true source track "${{ matrix.element }}"

      - name: Check for changes
        id: changes
        run: |
          BST_PATH="elements/${{ matrix.element }}"
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected for ${{ matrix.element }}"
          else
            # bst source track can normalize ref format without changing the underlying
            # commit (e.g. plain SHA -> git-describe "v1.15.2-0-g<sha>").
            # Compare the set of terminal 40-char hex SHAs from ref: lines in both
            # the old (HEAD) and new (working tree) file states. If identical,
            # only formatting changed — no real update, skip the PR.
            OLD_SHAS=$(git show "HEAD:$BST_PATH" | grep -oP '^\s*ref:\s+\K\S+' | grep -oP '[0-9a-f]{40}$' | sort)
            NEW_SHAS=$(grep -oP '^\s*ref:\s+\K\S+' "$BST_PATH" | grep -oP '[0-9a-f]{40}$' | sort)
            if [ -n "$OLD_SHAS" ] && [ "$OLD_SHAS" = "$NEW_SHAS" ]; then
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "Ref format normalized but same underlying commit(s) — skipping PR"
            else
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              echo "Changes detected:"
              git diff --stat
            fi
          fi

      - name: Apply tracking cooldown
        if: steps.changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/tracking-cooldown.sh "$BRANCH" elements/

      - name: Create or update PR
        if: steps.changes.outputs.has_changes == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          BASE_TITLE="${{ matrix.title }}"
          BST_PATH="elements/${{ matrix.element }}"

          # Extract old/new refs for PR body version context. Bracket the diff
          # marker ([-]/[+]) — bare "^+" is a literal plus only in GNU BRE; other
          # greps read it as a quantifier on "^" and match every line.
          OLD_REF=$(git diff -- "$BST_PATH" | grep '^[-].*ref:' | grep -oP "ref:\s+\K\S+" || true)
          NEW_REF=$(git diff -- "$BST_PATH" | grep '^[+].*ref:' | grep -oP "ref:\s+\K\S+" || true)

          # Strip the git-describe suffix off a ref to recover the full upstream
          # tag: "v5.0.0-beta.6-0-g<sha40>" -> "v5.0.0-beta.6". Anchoring on the
          # "-<offset>-g<sha>" tail keeps pre-release segments (-beta.6, -rc1)
          # that a "digits and dots only" match truncates, and drops the "-0"
          # offset that used to leak into titles as "v1.15.2-0".
          # Plain-SHA refs (branch-tracked elements with no reachable tag, e.g.
          # desktop/stb.bst) have no suffix to strip and yield an empty string,
          # so the Version row is omitted rather than showing a bare SHA. The
          # digit filter drops non-version tags like "release-0-g<sha>".
          #
          # A branch-tracked element whose nearest ANNOTATED tag is stale gets a
          # describe prefix that is real but wrong: desktop/oo7.bst tracks
          # refs/heads/main and every ref reads v0.6.0-alpha-<n>-g<sha>, because
          # upstream's 0.7.0.alpha is a lightweight tag and git-describe ignores
          # those. Both sides of the bump then describe to the same stale tag.
          # The title already guards on that (OLD_VER != NEW_VER below); the
          # Version row did not, so it rendered `v0.6.0-alpha` -> `v0.6.0-alpha`
          # on every oo7 PR -- a row asserting no change, on a PR that exists
          # only because something changed, naming a version upstream is well
          # past. Same guard on both, so the row appears only when it says
          # something. Commits/Compare still carry the real delta.
          describe_tag() {
            printf '%s\n' "$1" | grep -oP '^.+(?=-\d+-g[0-9a-f]{7,40}$)' | grep -P '\d' || true
          }

          OLD_VER=$(describe_tag "$OLD_REF")
          NEW_VER=$(describe_tag "$NEW_REF")

          if [ -n "$OLD_VER" ] && [ -n "$NEW_VER" ] && [ "$OLD_VER" != "$NEW_VER" ]; then
            TITLE="${BASE_TITLE}: ${OLD_VER} -> ${NEW_VER}"
          else
            TITLE="$BASE_TITLE"
          fi

          UPSTREAM_SLUG=$(grep -oP 'url:\s+github:\K[^\s.]+(?:\.git)?' "$BST_PATH" | head -1 | sed 's/\.git$//' || true)
          GITHUB_URL="https://github.com/${UPSTREAM_SLUG}"

          OLD_SHA=$(echo "$OLD_REF" | grep -oP '(?<=g)[0-9a-f]+$' || echo "$OLD_REF")
          NEW_SHA=$(echo "$NEW_REF" | grep -oP '(?<=g)[0-9a-f]+$' || echo "$NEW_REF")

          printf '%s\n' "$TITLE" > /tmp/commit-msg.txt
          bash scripts/commit-tracking-update.sh "$BRANCH" /tmp/commit-msg.txt elements/

          {
            echo "## \`${{ matrix.element }}\` update"
            echo ""
            if [ -n "$UPSTREAM_SLUG" ]; then
              echo "| | |"
              echo "| --- | --- |"
              echo "| **Source** | [$UPSTREAM_SLUG]($GITHUB_URL) |"
              if [ -n "$OLD_VER" ] && [ -n "$NEW_VER" ] && [ "$OLD_VER" != "$NEW_VER" ]; then
                echo "| **Version** | \`$OLD_VER\` → \`$NEW_VER\` |"
              fi
              if [ -n "$OLD_SHA" ] && [ -n "$NEW_SHA" ]; then
                echo "| **Commits** | [\`${OLD_SHA:0:8}\`]($GITHUB_URL/commit/$OLD_SHA) → [\`${NEW_SHA:0:8}\`]($GITHUB_URL/commit/$NEW_SHA) |"
                echo "| **Compare** | [$GITHUB_URL/compare/${OLD_SHA:0:8}...${NEW_SHA:0:8}]($GITHUB_URL/compare/${OLD_SHA}...${NEW_SHA}) |"
              fi
              echo "| **Releases** | [$GITHUB_URL/releases]($GITHUB_URL/releases) |"
              echo ""
            fi
            echo "---"
            echo "*Generated by [Track BuildStream Sources](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"
          } > /tmp/pr-body.md

          bash scripts/tracking-pr.sh "$BRANCH" "$TITLE" /tmp/pr-body.md

  # ── Atomic co-tracking of core junctions ─────────────────────────────────
  # freedesktop-sdk.bst overrides reference gnome-build-meta.bst elements
  # directly — both must land in one commit or the element graph breaks.
  track-core-junctions:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    if: >-
      github.event.inputs.group == 'all' ||
      github.event.inputs.group == 'core-junctions' ||
      github.event_name == 'schedule'
    env:
      BRANCH: auto/track-core-junctions
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Generate tracking bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TRACKING_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRACKING_APP_PRIVATE_KEY }}

      - name: Setup mise
        uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.10.17
          experimental: true

      - name: Install system dependencies
        # --update: refresh the apt index first — runner images carry stale
        # package lists, and a superseded .deb 404s on install (#900).
        run: mise bootstrap --yes --update

      - name: Track core junctions
        run: |
          uv run bst --no-interactive -o x86_64_v3 true source track gnome-build-meta.bst
          uv run bst --no-interactive -o x86_64_v3 true source track freedesktop-sdk.bst

      - name: Create or update PR
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git diff --quiet && { echo "No junction updates"; exit 0; }
          bash scripts/tracking-cooldown.sh "$BRANCH" elements/gnome-build-meta.bst elements/freedesktop-sdk.bst

          TITLE="chore(deps): update core junctions (gnome-build-meta + freedesktop-sdk)"
          printf '%s\n' "$TITLE" > /tmp/commit-msg.txt
          bash scripts/commit-tracking-update.sh "$BRANCH" /tmp/commit-msg.txt elements/gnome-build-meta.bst elements/freedesktop-sdk.bst

          printf '%s\n' "Updates \`gnome-build-meta.bst\` and \`freedesktop-sdk.bst\` atomically. Manual review required — junction bumps can break downstream elements." > /tmp/pr-body.md
          bash scripts/tracking-pr.sh "$BRANCH" "$TITLE" /tmp/pr-body.md

