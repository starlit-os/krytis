name: Build ISO

# Manual trigger only for now (#844). No push/schedule trigger yet — this is
# the first run of `mise run build-iso` on the always-on VPS runner
# (docs/skills/ci-runner.md § Always-on VPS Runner). The runner has been
# re-provisioned with the extra host packages this job needs
# (squashfs-tools/mtools/dosfstools — files/runner-vps/provision.sh) as part
# of landing this workflow. Once a few workflow_dispatch runs have proven
# the job out, graduate the trigger (push to main / release tags) in a
# follow-up.
#
# Builds from the already-published ghcr.io/starlit-os/krytis:latest (or,
# with sealed=true, :sealed) rather than running `mise run build`/
# `mise run seal-uki` first — those are publish.yml's job, not this one's
# concern. Same tradeoff verify-sealed.yml makes for :sealed: pull the
# artifact publish.yml already produced and exercise the next stage of the
# pipeline against it. sealed=true needs no Proton Pass / signing-key
# access at all (#862) — `mise run build-iso --sealed --payload-image
# ghcr.io/starlit-os/krytis:sealed` takes the already-signed published
# image as-is via `scripts/ensure-sealed-image.sh`'s explicit-ref path,
# which only requires the ref to exist locally and asserts it's genuinely
# sealed (`/boot/EFI/Linux/krytis.efi` present) — it never re-seals.
#
# publish_r2=true additionally uploads the sealed ISO to Cloudflare R2,
# which is what https://iso.ririi.dev/krytis-live-sealed.iso serves (#867).
# It is a separate input from sealed, not implied by it, so a sealed test
# dispatch does not have to overwrite the object the public download URL
# points at. There is no unsealed-to-R2 path at all: publishing an
# unsigned, non-Secure-Boot image at a "download Krytis here" URL would
# invert the trust model the sealed build exists to establish, so the
# combination fails the job immediately rather than silently doing
# something reasonable-looking.

on:
  workflow_dispatch:
    inputs:
      compression:
        description: 'Squashfs compression mode'
        type: choice
        options:
          - fast
          - release
        default: fast
      sealed:
        description: 'Install the sealed (signed UKI) image, pulled from ghcr — not re-sealed locally (#862)'
        type: boolean
        default: false
      publish_r2:
        description: 'Upload the sealed ISO to Cloudflare R2 as the public "latest" download (iso.ririi.dev) — only valid with sealed=true (#867)'
        type: boolean
        default: false

permissions: read-all

concurrency:
  group: krytis-build-iso
  cancel-in-progress: false

jobs:
  build-iso:
    name: Build live ISO (VPS)
    # Same distinct-label reasoning as cache-warm.yml: without krytis-vps,
    # `[self-hosted, linux, x64]` would also match the local container
    # runner (mise.toml RUNNER_LABELS) whenever both happen to be online.
    # No Blacksmith fallback (unlike cache-warm/publish) — Blacksmith has
    # none of the host packages this job needs (mksquashfs, mtools,
    # dosfstools, rclone) and provisioning an ephemeral runner for those on every
    # run is wasted work the always-on VPS doesn't have to repeat.
    runs-on: [self-hosted, linux, x64, krytis-vps]
    timeout-minutes: 60
    steps:
      # Kept ahead of checkout deliberately: an invalid input combination
      # should cost seconds, not the ~40 minutes of build this job would
      # otherwise spend before reaching the upload step and failing there.
      - name: Reject publish_r2 without sealed
        if: ${{ inputs.publish_r2 && !inputs.sealed }}
        run: |
          echo "::error::publish_r2=true requires sealed=true — there is no unsealed-to-R2 publish path (#867)."
          exit 1

      # Default `clean: true` runs `git clean -ffdx` after checkout, which
      # wipes the untracked `output/` dir this job builds into — including
      # any squashfs staging tree (`output/krytis-sfs-root`) a killed
      # previous run left behind. That's the fix for issue #844's "disk
      # exhaustion mid-build" pitfall: _ns_build_squashfs's own EXIT trap
      # only cleans up on a normal failure, not an OOM/timeout kill, but
      # checkout's clean step doesn't care how the previous run died.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: 2026.9.12
          experimental: true

      - name: Install system dependencies
        # --update: refresh the apt index first — runner images carry stale
        # package lists, and a superseded .deb 404s on install (#900).
        run: mise bootstrap --yes --update

      - name: Install Python dependencies
        run: uv sync

      - name: Verify privileged podman works
        # _ns_build_squashfs's VFS-store import (skopeo copy into a
        # bind-mounted dir) needs `podman run --privileged`. This job runs
        # as root (RUNNER_ALLOW_RUNASROOT=1), so rootful podman applies —
        # but some seccomp profiles block CAP_SYS_ADMIN even for root.
        # Fail loudly here instead of ~15 minutes into the build.
        run: podman run --rm --privileged busybox true

      - name: Pull payload image
        run: podman pull ghcr.io/starlit-os/krytis:latest

      - name: Pull sealed payload image
        if: inputs.sealed
        # `mise run build-iso --sealed --payload-image <ref>` requires this
        # exact ref to already exist locally — scripts/ensure-sealed-image.sh
        # skips seal-uki entirely for an explicit ref and only checks
        # existence + genuine-seal (see the header comment above). No
        # re-tag needed: podman pull already stores it under this name.
        run: podman pull ghcr.io/starlit-os/krytis:sealed

      - name: Tag payload image for build-iso
        # build-iso expects the unsigned payload as localhost/krytis:latest
        # (what `mise run build` tags locally). This job never runs that
        # build, so alias the pulled published image onto the same tag.
        run: podman tag ghcr.io/starlit-os/krytis:latest localhost/krytis:latest

      - name: Print disk usage before build
        run: df -h -x fuse || true

      - name: Build ISO
        run: |
          if [[ "${{ inputs.sealed }}" == "true" ]]; then
            mise run build-iso --compression "${{ inputs.compression }}" \
              --sealed --payload-image ghcr.io/starlit-os/krytis:sealed
          else
            mise run build-iso --compression "${{ inputs.compression }}"
          fi

      - name: Verify ISO payload
        # Sealed builds only: `build-iso --sealed` already runs
        # verify-iso-payload internally right after assembly (against the
        # exact ref passed to --payload-image), so re-verifying here would
        # be redundant. The unsealed path has no such internal check.
        if: ${{ !inputs.sealed }}
        run: mise run verify-iso-payload --iso output/krytis-live.iso --image localhost/krytis:latest

      - name: Publish sealed ISO to R2
        # Credentials arrive as RCLONE_CONFIG_* env vars scoped to this one
        # step, which is rclone's documented way to define a remote with no
        # config file — nothing is written to the VPS runner's persistent
        # disk, so a compromised later job on this always-on box finds no
        # rclone.conf to read. The remote is named `r2`, hence the
        # RCLONE_CONFIG_R2_* prefix.
        if: ${{ inputs.sealed && inputs.publish_r2 }}
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          RCLONE_CONFIG_R2_REGION: auto
          # Required, not an optimisation. rclone checks a bucket exists
          # (and would create it) before its first upload, which an
          # Object-Read-&-Write-scoped token has no permission to do —
          # bucket-level calls are Admin scope. rclone's own S3 docs say so
          # under Cloudflare R2: "For R2 tokens with the 'Object Read &
          # Write' permission, you may also need to add no_check_bucket =
          # true for object uploads to work correctly." Without it the
          # upload fails after the ~40-minute build has already run.
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
        run: |
          ISO=output/krytis-live-sealed.iso
          sha256sum "${ISO}" | awk '{print $1}' > "${ISO}.sha256"

          echo "==> Uploading ${ISO} to r2://krytis-iso/krytis-live-sealed.iso..."
          rclone copyto "${ISO}" r2:krytis-iso/krytis-live-sealed.iso \
            --header-upload "Content-Type: application/x-iso9660-image" \
            --header-upload "Cache-Control: public, max-age=3600, must-revalidate" \
            --progress

          echo "==> Uploading checksum..."
          rclone copyto "${ISO}.sha256" r2:krytis-iso/krytis-live-sealed.iso.sha256 \
            --header-upload "Content-Type: text/plain" \
            --header-upload "Cache-Control: public, max-age=3600, must-revalidate"

      - name: Verify the public download
        # Proves the URL users are pointed at serves *this* run's bytes, not
        # a stale edge-cached copy or a truncated upload. Checking size and
        # checksum separately is not redundant: a content-length match with
        # a checksum mismatch means Cloudflare served an equally-sized older
        # object, which is exactly the failure a size-only check misses.
        if: ${{ inputs.sealed && inputs.publish_r2 }}
        run: |
          LOCAL_SIZE=$(stat -c%s output/krytis-live-sealed.iso)
          REMOTE_SIZE=$(curl -sI https://iso.ririi.dev/krytis-live-sealed.iso | awk 'BEGIN{IGNORECASE=1} /^content-length:/{print $2}' | tr -d '\r')
          echo "local=${LOCAL_SIZE} remote=${REMOTE_SIZE}"
          [ "${LOCAL_SIZE}" = "${REMOTE_SIZE}" ] || { echo "::error::Published object size does not match the built ISO — upload may have been served from stale edge cache or truncated." >&2; exit 1; }

          REMOTE_SHA=$(curl -sL https://iso.ririi.dev/krytis-live-sealed.iso.sha256)
          LOCAL_SHA=$(cat output/krytis-live-sealed.iso.sha256)
          [ "${REMOTE_SHA}" = "${LOCAL_SHA}" ] || { echo "::error::Published checksum does not match the built ISO." >&2; exit 1; }
          echo "==> iso.ririi.dev serves the ISO this run built (size + checksum both match)."

      - name: Print disk usage after build
        if: always()
        run: df -h -x fuse || true

      - name: Upload ISO artifact
        # Skipped when this run published to R2: iso.ririi.dev already
        # serves those exact bytes, so the artifact would be a redundant
        # 4.5 GB copy of a publicly fetchable file, billed against Actions
        # storage. Every other path still uploads — the unsealed
        # build has no other distribution route (#867 keeps it as an
        # internal-testing artifact deliberately), and a sealed build with
        # publish_r2=false is a test dispatch that must stay retrievable.
        #
        # The `|| failure()` is what makes the skip safe rather than a
        # data-loss path. Steps default to running only on success, so
        # without it a failed upload or a failed public-download check
        # would discard a 4.5 GB ISO that took ~40 minutes to build, and
        # the next run's `git clean -ffdx` wipes output/ before a retry
        # could reuse it. With it, a publish failure falls back to the
        # artifact and the rebuild is avoidable. If the *build* itself
        # failed there is no ISO to find, and upload-artifact's default
        # if-no-files-found: warn leaves the real error as the only one
        # reported.
        if: ${{ !(inputs.sealed && inputs.publish_r2) || failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: krytis-live-iso-${{ github.run_id }}
          path: ${{ inputs.sealed && 'output/krytis-live-sealed.iso' || 'output/krytis-live.iso' }}
          # 1, not #844's original 7. At 4.5 GB per run this is the
          # difference between an ISO costing a day of Actions storage and
          # a week of it, and nothing here is a durable artifact: every
          # remaining upload is a same-session internal test (unsealed
          # build, sealed dry-run, or a publish-failure rescue copy),
          # fetched within minutes or not at all. Anything meant to
          # outlive the session belongs on R2, which is what publish_r2
          # exists for.
          retention-days: 1

      - name: Clean up local images
        # Best-effort, never fails the job (§ "does this decide anything?"
        # in docs/skills/ci-runner.md) — this box is persistent and every
        # run otherwise leaves ~7GB per pulled image plus the iso-tools and
        # krytis-installer builds behind it. Listing both sealed and
        # unsealed tags unconditionally is simpler than branching on
        # inputs.sealed here — podman rmi on a nonexistent tag is already
        # swallowed by the 2>/dev/null || true below.
        #
        # localhost/krytis:iso-payload (8.23G) was missing from this list
        # until #938 and survived every run, which is most of what the
        # weekly GC found stranded. If a future change adds another
        # intermediate tag, add it here too — files/runner-vps/gc.sh is the
        # backstop for runs killed before this step, not a substitute for
        # listing what the job creates.
        if: always()
        run: |
          podman rmi -f localhost/krytis-installer localhost/iso-tools:latest \
            localhost/krytis:latest localhost/krytis:iso-payload \
            ghcr.io/starlit-os/krytis:latest \
            ghcr.io/starlit-os/krytis:sealed 2>/dev/null || true
