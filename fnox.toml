# Never inject these into a shell. Every krytis caller reads a secret explicitly
# with `fnox get NAME`, which ignores this setting; the only consumer of the
# default `env = true` is the `fnox activate` prompt hook, and that hook paid for
# it on every prompt inside the checkout: ten concurrent pass-cli calls, which
# corrupt a logged-out pass-cli state (#987), and the UEFI private keys exported
# into the interactive shell. See
# docs/skills/mise.md § Switching the backend under a live session
env = false

[providers.protonpass]
type = "proton-pass"
vault = "Krytis"
agent_reason = "krytis secure boot key + buildbarn cache token + CI VPS host retrieval"

[secrets]
PK_KEY  = { provider = "protonpass", value = "Secure Boot Keys/PK.key" }
PK_CRT  = { provider = "protonpass", value = "Secure Boot Keys/PK.crt" }
KEK_KEY = { provider = "protonpass", value = "Secure Boot Keys/KEK.key" }
KEK_CRT = { provider = "protonpass", value = "Secure Boot Keys/KEK.crt" }
DB_KEY  = { provider = "protonpass", value = "Secure Boot Keys/db.key" }
DB_CRT  = { provider = "protonpass", value = "Secure Boot Keys/db.crt" }
BUILDBARN_PULL_TOKEN = { provider = "protonpass", value = "Buildbarn/pull-token" }
BUILDBARN_PUSH_TOKEN = { provider = "protonpass", value = "Buildbarn/push-token" }
# Always-on Debian CI VPS runner (#794). The vault item holds the host as two
# separate fields ("Username", "IP Address"); scripts/runner-vps-host.sh joins
# them into RUNNER_VPS_HOST. Kept as references rather than a .mise.local.toml
# entry so a fresh checkout on any operator machine can reach the box without
# hand-copying an address — see docs/skills/ci-runner.md § Always-on VPS runner.
RUNNER_VPS_USER = { provider = "protonpass", value = "Krytis Build VPS/Username" }
RUNNER_VPS_IP   = { provider = "protonpass", value = "Krytis Build VPS/IP Address" }
