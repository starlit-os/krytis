aliases:
  # file aliases (tarballs, single-file downloads)
  # CachyOS's live x86_64_v3 pacman repo. It holds only the newest build of
  # each package, so a pinned file 404s here once a newer pkgver/pkgrel lands;
  # the `cachyos-archive` mirror below picks it up from there.
  cachyos_v3: https://cdn77.cachyos.org/repo/x86_64_v3/cachyos-v3/
  crates: https://static.crates.io/
  ghostty_deps: https://deps.files.ghostty.org/
  ghostty_releases: https://release.files.ghostty.org/
  pikaos_files: https://git.pika-os.com/
  ziglang: https://ziglang.org/
  freedesktop_files: https://gitlab.freedesktop.org/
  freedesktop_software: https://www.freedesktop.org/software/
  ftp_gnu_org: https://ftp.gnu.org/gnu/
  codeberg_files: https://codeberg.org/
  github_files: https://github.com/
  # raw file blobs pinned at a commit (github_files serves these only via a
  # redirect to this host). No element uses it today; mise/lib/zig_zon.py's
  # URL_ALIASES emits it for Zig dependencies hosted there, so keep the two in
  # sync.
  github_raw: https://raw.githubusercontent.com/
  gitlab_files: https://gitlab.com/
  gnome_downloads: https://download.gnome.org/sources/
  proton_me: https://proton.me/
  pypi: https://files.pythonhosted.org/packages/
  qemu: https://download.qemu.org/
  # Tailscale's own package host. Stable Linux tarballs only; GitHub releases
  # carry no assets. distsign.pub lives at the host root, not under stable/
  # (mise/tasks/tailscale-update).
  tailscale_pkgs: https://pkgs.tailscale.com/stable/

  # git aliases
  codeberg: https://codeberg.org/
  freedesktop: https://gitlab.freedesktop.org/
  github: https://github.com/
  gitlab: https://gitlab.com/
  gnome: https://gitlab.gnome.org/GNOME/
  gnome_gitlab: https://gitlab.gnome.org/
  kernel: https://git.kernel.org/pub/scm/
  sourcehut: https://git.sr.ht/

# BuildStream tries every mirror URI before the alias's own URI, falling
# through on any fetch error (Source.__do_fetch). For cachyos_v3 that means:
# a current pin gets the archive's HTTP 200 HTML placeholder (it never 404s),
# fails the sha256 check, then downloads from cdn77; a superseded
# pin downloads from the archive. The archive holds the same files (sha256
# identical), so the ref never changes when a build moves there. It does not
# yet hold the current build, which is why it cannot replace the alias.
# mirror.cachyos.org and cdn.cachyos.org are no fallback: both answer a
# package URL with HTTP 200 and an HTML placeholder page (as of 2026-10-22).
# See docs/skills/bst.md § CachyOS removes superseded builds from its repo.
mirrors:
- name: cachyos-archive
  aliases:
    cachyos_v3:
    - https://archive.cachyos.org/archive/cachyos-v3/
